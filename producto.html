<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sendera | Producto</title>
  <link rel="apple-touch-icon" href="img/logo.png" />
  <link rel="icon" type="image/png" href="img/logo.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#e8ddc8" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #e8e4dc;
      min-height: 100vh;
    }

    /* ── NAVBAR ─────────────────────────────────────────────────── */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #3a3026;
      text-decoration: none;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 30px;
      transition: background 0.2s;
    }
    .btn-back:hover { background: rgba(255,255,255,0.88); }

    .cart-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(10px);
      border: none;
      border-radius: 30px;
      padding: 8px 16px;
      font-size: 1rem;
      cursor: pointer;
      color: #3a3026;
      transition: background 0.2s;
    }
    .cart-nav-btn:hover { background: rgba(255,255,255,0.88); }

    /* ── LAYOUT PRINCIPAL ───────────────────────────────────────── */
    .product-page {
      display: grid;
      grid-template-columns: 55% 45%;
      min-height: 100vh;
    }

    /* ── PANEL IZQUIERDO — imagen + fondo ────────────────────────── */
    .product-left {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      /* El fondo toma el color de la foto de la variante (como en "Elegí tu color y salí") */
      background: var(--prod-bg, #e8e4dc);
      transition: background-color 0.6s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Fondo desenfocado */
    .product-bg, .product-bg-overlay { display: none; }
    .product-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(28px);
      transform: scale(1.1);
      opacity: 0.55;
      transition: background-image 0.4s, opacity 0.4s;
      pointer-events: none;
    }

    .product-bg-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.25);
      pointer-events: none;
    }

    /* Wrapper interno: miniaturas + imagen grande */
    .product-left-inner {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 84%;
      max-width: 520px;
    }

    /* Tira de miniaturas vertical */
    .thumb-strip {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      width: 68px;
      max-height: 420px;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .thumb-strip::-webkit-scrollbar { display: none; }
    .thumb-strip.hidden { display: none; }

    .thumb-item {
      width: 68px;
      height: 68px;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.5);
      transition: border-color 0.2s, box-shadow 0.2s;
      background: rgba(255,255,255,0.6);
      flex-shrink: 0;
    }
    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb-item.active {
      border-color: #3a3026;
      box-shadow: 0 0 0 1px #3a3026;
    }
    .thumb-item:hover:not(.active) {
      border-color: rgba(58,48,38,0.4);
    }

    /* Foto del producto, encima del fondo */
    .product-img-container {
      position: relative;
      flex: 1;
      aspect-ratio: 1/1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-main-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 32px;
      transition: opacity 0.3s;
    }

    .product-main-img.fading { opacity: 0; }

    /* Dots para móvil (reemplaza miniaturas) */
    .carousel-dots-mobile {
      display: none;
      position: absolute;
      bottom: 10px;
      left: 0; right: 0;
      justify-content: center;
      gap: 6px;
      z-index: 3;
    }
    .carousel-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgba(80,60,30,0.25);
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .carousel-dot.active {
      background: #3a3026;
      transform: scale(1.25);
    }

    /* ── PANEL DERECHO — info ───────────────────────────────────── */
    .product-right {
      background: color-mix(in srgb, var(--prod-bg, #faf8f4) 22%, #faf8f4);
      transition: background-color 0.6s ease;
      padding: 80px 48px 60px 44px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      min-height: 100vh;
    }

    .product-breadcrumb {
      font-size: 0.63rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #c8861a;
      margin-bottom: 14px;
    }

    .product-title {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(1.7rem, 2.4vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #1e1a12;
      line-height: 1.05;
      margin-bottom: 8px;
    }

    .product-subtitle {
      font-size: 0.75rem;
      color: #9a8f82;
      letter-spacing: 0.06em;
      margin-bottom: 28px;
      font-weight: 300;
    }

    .product-price {
      font-size: 2.4rem;
      font-weight: 300;
      color: #1e1a12;
      margin-bottom: 28px;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .product-price .currency {
      font-size: 0.45em;
      color: #9a8f82;
      font-weight: 400;
      vertical-align: middle;
      letter-spacing: 0.05em;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: #ede8e0;
      margin: 20px 0;
    }

    /* Selector de color */
    .color-section { margin-bottom: 24px; }

    .color-label {
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #9a8f82;
      margin-bottom: 12px;
    }
    .color-label span { color: #1e1a12; }

    .color-swatches { display: flex; gap: 10px; flex-wrap: wrap; }

    .swatch {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.14);
    }
    .swatch.active {
      border-color: #fff;
      box-shadow: 0 0 0 2px #1e1a12, 0 2px 8px rgba(0,0,0,0.18);
    }
    .swatch:hover { transform: scale(1.1); }

    /* Botones */
    .btn-add-cart-detail {
      width: 100%;
      padding: 15px;
      background: #5c9940;
      color: #fff;
      border: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 6px;
      margin-bottom: 10px;
      transition: background 0.2s;
    }
    .btn-add-cart-detail:hover { background: #3d5e2c; }
    .btn-add-cart-detail:active { transform: scale(0.99); }

    .btn-whatsapp-detail {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      background: transparent;
      border: 1.5px solid #ddd5c8;
      color: #3a3026;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 6px;
      margin-bottom: 24px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-whatsapp-detail:hover { background: rgba(0,0,0,0.03); border-color: #b0a898; }

    .added-feedback {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 0.76rem;
      color: #507a3a;
      font-weight: 600;
      margin-bottom: 10px;
      padding: 10px 14px;
      background: rgba(80,122,58,0.07);
      border-radius: 6px;
    }
    .added-feedback.visible { display: flex; }

    /* Features */
    .product-features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: #3a3026;
      font-weight: 500;
    }
    /* Íconos de línea, del mismo estilo que los de "¿Por qué elegirnos?" */
    .feature-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      stroke: #c8861a;
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Envíos: las tres opciones reales, una por línea */
    .product-shipping {
      display: grid;
      gap: 10px;
      padding: 16px 0 0;
      border-top: 1px solid #ede8e0;
    }
    .envio-linea {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
      color: #3a3026;
    }
    .envio-linea svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      stroke: #c8861a;
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .envio-linea b { font-weight: 700; }
    .envio-linea span { color: #7a6e62; }

    /* ── TAMBIÉN TE PUEDE GUSTAR ───────────────────────────────── */
    .relacionados {
      --rel-pad: max(24px, calc((100% - 1180px) / 2));
      background: color-mix(in srgb, var(--prod-bg, #faf8f4) 22%, #faf8f4);
      transition: background-color 0.6s ease;
      padding: 56px 0 72px;
      border-top: 1px solid rgba(30, 26, 18, 0.08);
    }
    .relacionados-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--rel-pad);
      margin-bottom: 20px;
    }
    .relacionados h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(1.4rem, 2.4vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #1e1a12;
    }
    .relacionados-flechas { display: flex; gap: 10px; }
    .relacionados-flecha {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1.5px solid rgba(30, 26, 18, 0.2);
      background: #fff;
      color: #1e1a12;
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .relacionados-flecha:hover { background: #1e1a12; color: #fff; }
    .relacionados-track {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      margin: 0 var(--rel-pad);
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .relacionados-track::-webkit-scrollbar { display: none; }
    .rel-card {
      flex: 0 0 calc((100% - 4 * 18px) / 5);
      scroll-snap-align: start;
      color: inherit;
      text-decoration: none;
    }
    .rel-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 18px;
      display: block;
      background: #ede8e0;
    }
    .rel-card b { display: block; margin-top: 10px; font-size: 0.9rem; color: #1e1a12; }
    .rel-card span { font-size: 0.8rem; color: #7a6e62; }
    @media (max-width: 1100px) { .rel-card { flex-basis: calc((100% - 3 * 18px) / 4); } }
    @media (max-width: 768px) {
      .relacionados { padding: 40px 0 56px; }
      .relacionados-head { padding: 0 16px; }
      .relacionados-flechas { display: none; }
      .relacionados-track { margin: 0; padding: 0 16px; scroll-padding-left: 16px; gap: 14px; }
      .rel-card { flex-basis: 44vw; }
    }

    /* ── CARRITO ─────────────────────────────────────────────────── */
    #cart-btn {
      position: fixed;
      bottom: 28px; right: 28px;
      z-index: 200;
      background: #1e1a17;
      color: #c9b07a;
      border: none;
      width: 54px; height: 54px;
      border-radius: 50%;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.22);
      transition: transform 0.2s;
    }
    #cart-btn:hover { transform: scale(1.08); }
    @keyframes bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.18)} }
    .cart-bounce { animation: bounce 0.4s ease; }

    #cart-count {
      position: absolute;
      top: -4px; right: -4px;
      background: #c8861a;
      color: #fff;
      font-size: 0.62rem; font-weight: 700;
      width: 18px; height: 18px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
    }

    #cart-modal {
      position: fixed;
      bottom: 92px; right: 28px;
      width: 360px; max-height: 85vh;
      display: flex; flex-direction: column;
      background: #faf7f3;
      border: 1px solid #e0d8cc;
      z-index: 199;
      transform: translateY(20px);
      opacity: 0; pointer-events: none;
      transition: all 0.3s;
      box-shadow: 0 8px 40px rgba(60,40,20,0.18);
      border-radius: 14px;
      overflow: hidden;
    }
    #cart-modal.open { transform: translateY(0); opacity: 1; pointer-events: all; }

    .cart-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid #ede5d8;
    }
    .cart-header h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem; color: #2a2218; letter-spacing: 0.06em;
    }
    .cart-close { background: none; border: none; color: #9a8f82; font-size: 1rem; cursor: pointer; }

    #cart-items { overflow-y: auto; max-height: 200px; padding: 12px 20px; flex-shrink: 0; }
    #cart-items::-webkit-scrollbar { width: 3px; }
    #cart-items::-webkit-scrollbar-track { background: transparent; }
    #cart-items::-webkit-scrollbar-thumb { background: #d0c8bc; border-radius: 2px; }
    .cart-empty { color: #9a8f82; font-size: 0.88rem; text-align: center; padding: 20px 0; }
    .cart-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0ebe3; }
    .cart-item-info { flex: 1; display: flex; flex-direction: column; }
    .cart-item-name { color: #2a2218; font-size: 0.85rem; font-weight: 500; }
    .cart-item-variant { color: #9a8f82; font-size: 0.75rem; }
    .cart-item-controls { display: flex; align-items: center; gap: 8px; }
    .cart-item-controls button { background: rgba(0,0,0,0.06); border: none; color: #2a2218; width: 24px; height: 24px; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
    .cart-item-controls span { color: #2a2218; font-size: 0.85rem; min-width: 16px; text-align: center; }
    .cart-item-price { color: #2a2218; font-size: 0.88rem; font-weight: 600; min-width: 50px; text-align: right; }
    .cart-item-remove { background: none; border: none; color: #9a8f82; cursor: pointer; font-size: 0.75rem; padding: 4px; }

    .cart-footer { padding: 16px 20px; border-top: 1px solid #ede5d8; overflow-y: auto; flex: 1; }
    .cart-footer::-webkit-scrollbar { width: 3px; }
    .cart-footer::-webkit-scrollbar-track { background: transparent; }
    .cart-footer::-webkit-scrollbar-thumb { background: #d0c8bc; border-radius: 2px; }

    .cart-total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.85rem; color: #2a2218; }
    .total-final { border-top: 1px solid #e0d8cc; padding-top: 10px; margin-top: 6px; margin-bottom: 14px; font-weight: 700; font-size: 1rem; color: #507a3a; }

    .envio-section { margin-bottom: 14px; }
    .envio-titulo { font-size: 0.72rem; color: #507a3a; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 10px; font-weight: 600; }
    .envio-opcion { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #e0d8cc; margin-bottom: 6px; cursor: pointer; transition: border-color 0.2s; border-radius: 8px; background: #fff; }
    .envio-opcion:hover { border-color: #507a3a; }
    .envio-opcion input[type="radio"] { accent-color: #507a3a; flex-shrink: 0; }
    .envio-info { display: flex; flex-direction: column; flex: 1; }
    .envio-nombre { font-size: 0.82rem; color: #2a2218; }
    .envio-detalle { font-size: 0.7rem; color: #9a8f82; margin-top: 1px; }
    .envio-precio { font-size: 0.82rem; color: #507a3a; font-weight: 600; white-space: nowrap; }
    .envio-campos { padding: 10px 12px 4px; background: #f5f0ea; border: 1px solid #e0d8cc; border-top: none; margin-bottom: 6px; border-radius: 0 0 8px 8px; }
    .envio-input { width: 100%; padding: 9px 12px; background: #fff; border: 1px solid #e0d8cc; color: #2a2218; font-family: 'Montserrat', sans-serif; font-size: 0.82rem; outline: none; margin-bottom: 8px; transition: border-color 0.2s; border-radius: 6px; }
    .envio-input:focus { border-color: #507a3a; }
    .envio-radio-group { display: flex; gap: 16px; margin-bottom: 8px; }
    .envio-sub { font-size: 0.78rem; color: #7a6e62; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .envio-sub input { accent-color: #507a3a; }

    .cart-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    .cart-form input { background: #fff; border: 1px solid #e0d8cc; color: #2a2218; padding: 10px 14px; font-size: 0.85rem; font-family: 'Montserrat', sans-serif; outline: none; transition: border-color 0.2s; border-radius: 8px; }
    .cart-form input:focus { border-color: #507a3a; }
    .cart-form input::placeholder { color: #b0a598; }

    .btn-send-order { width: 100%; padding: 13px; background: #507a3a; color: #fff; border: none; font-family: 'Montserrat', sans-serif; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: background 0.2s; border-radius: 10px; }
    .btn-send-order:hover { background: #3d5e2c; }
    .btn-mp { width: 100%; padding: 13px; background: #009ee3; color: #fff; border: none; font-family: 'Montserrat', sans-serif; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; margin-top: 10px; transition: background 0.2s; border-radius: 10px; }
    .btn-mp:hover { background: #007dc1; }
    .btn-mp:disabled { opacity: 0.6; cursor: not-allowed; }
    .envio-row { color: #9a8f82; font-size: 0.8rem; }
    .cart-note { color: #9a8f82; font-size: 0.74rem; text-align: center; margin-top: 10px; letter-spacing: 0.03em; }

    /* ── MOBILE ─────────────────────────────────────────────────── */
    @media (max-width: 720px) {
      #cart-modal { width: calc(100vw - 24px); right: 12px; }
      #cart-btn { right: 14px; bottom: 18px; }

      .product-page { grid-template-columns: 1fr; }

      .product-left {
        position: relative;
        height: 80vw;
        max-height: 420px;
        overflow: hidden;
      }

      .product-left-inner {
        width: 100%;
        height: 100%;
        justify-content: center;
      }

      .thumb-strip { display: none; }
      .carousel-dots-mobile { display: flex; }

      .product-img-container { flex: none; width: 78%; }

      .product-right {
        padding: 28px 22px 32px;
        min-height: auto;
      }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <a href="index.html" onclick="event.preventDefault();history.back();" class="btn-back">← Volver</a>
    <button type="button" class="cart-nav-btn" onclick="toggleCart()">🛒 <span id="cart-count" style="display:none;background:#5c9940;color:#fff;border-radius:50%;width:18px;height:18px;font-size:0.65rem;font-weight:700;align-items:center;justify-content:center;">0</span></button>
  </header>

  <div class="product-page" id="product-page">
    <div style="grid-column:1/-1;display:flex;align-items:center;justify-content:center;min-height:80vh;font-size:0.82rem;color:#9a8f82;letter-spacing:0.1em;">
      Cargando...
    </div>
  </div>

  <!-- TAMBIÉN TE PUEDE GUSTAR (otros productos de la misma categoría) -->
  <section class="relacionados" id="relacionados" style="display:none">
    <div class="relacionados-head">
      <h2>También te puede gustar</h2>
      <div class="relacionados-flechas">

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js?v=2"></script>
  <script src="cart.js?v=4"></script>
  <script>
    // ── MAPAS DE COLOR ─────────────────────────────────────────────
    const COLOR_BG = {
      beige:'#ddd3b0',arena:'#ddd3b0',crema:'#dfd5b4',natural:'#dbd1ac',
      gris:'#cacdd6',grey:'#cacdd6',gray:'#cacdd6',
      rosado:'#eacfcb',rosa:'#eacfcb',pink:'#eacfcb',
      blanco:'#e0dcd4',white:'#e0dcd4',
      verde:'#bfcfb8',green:'#bfcfb8',lima:'#c4d492',lime:'#c4d492',
      morado:'#cfc8e0',violeta:'#cfc8e0',lila:'#d5cce8',purple:'#cfc8e0',
      negro:'#444038',black:'#444038',
      azul:'#bcc8dc',blue:'#bcc8dc',celeste:'#b8d0e0',
      rojo:'#e0c4c0',red:'#e0c4c0',
      naranja:'#e4d0a4',orange:'#e4d0a4',
      amarillo:'#dcd88c',yellow:'#dcd88c',
    };
    const COLOR_SWATCH = {
      beige:'#c4aa78',arena:'#c4aa78',crema:'#c8b480',natural:'#b89860',
      gris:'#7a8898',grey:'#7a8898',gray:'#7a8898',
      rosado:'#dc8888',rosa:'#dc8888',pink:'#e890a0',
      blanco:'#d5d0c8',white:'#d0ccc4',
      verde:'#6a9858',green:'#6a9858',lima:'#88c040',lime:'#88c040',
      morado:'#9878c0',violeta:'#9070b4',lila:'#a88cc8',purple:'#9070b0',
      negro:'#282420',black:'#202020',
      azul:'#5070a8',blue:'#4060a0',celeste:'#5898c0',
      rojo:'#b84040',red:'#b03030',
      naranja:'#d07030',orange:'#c86820',
      amarillo:'#c0a820',yellow:'#c8b020',
    };

    const FEATURES_MAP = {
      'Gorros Visera':[{i:'🏔️',l:'Liviano'},{i:'💨',l:'Transpirable'},{i:'🔧',l:'Ajustable'},{i:'💧',l:'Impermeable'}],
      'Gorros Invierno':[{i:'🧊',l:'Térmico'},{i:'🔥',l:'Abrigo'},{i:'🎿',l:'Outdoor'},{i:'✨',l:'Cómodo'}],
      'Buff':[{i:'💨',l:'Transpirable'},{i:'🔄',l:'Versátil'},{i:'💧',l:'Secado rápido'},{i:'🏃',l:'Running'}],
      default:[{i:'🏔️',l:'Outdoor'},{i:'⭐',l:'Calidad'},{i:'💧',l:'Resistente'},{i:'✨',l:'Estilo'}],
    };

    // Íconos de línea para las características (por nombre); si no hay uno, un tilde
    const ICONOS_FEATURE = {
      'Liviano': '<path d="M12 3v3M12 18v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M3 12h3M18 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/><circle cx="12" cy="12" r="3"/>',
      'Transpirable': '<path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h8"/>',
      'Ajustable': '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
      'Impermeable': '<path d="M12 2.7S6 9.5 6 14a6 6 0 0 0 12 0c0-4.5-6-11.3-6-11.3z"/>',
      'Térmico': '<path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/>',
      'Abrigo': '<path d="M12 2c1 3 4 4.5 4 8.5a4 4 0 0 1-8 0C8 8 10 6.5 10 4c1.5 1 2 2 2 2"/><path d="M8 14a4 4 0 0 0 8 0"/>',
      'Outdoor': '<path d="M3 20l6-10 4 6 3-4 5 8z"/><circle cx="17" cy="6" r="2"/>',
      'Cómodo': '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',
      'Versátil': '<path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/>',
      'Secado rápido': '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
      'Running': '<circle cx="14" cy="4" r="2"/><path d="M6 20l3-6 3 2 1-5 3 3h3M9 11l2-3h4"/>',
      'Calidad': '<path d="M12 2l3 6.3 7 1-5 4.8 1.2 6.9L12 17.8 5.8 21l1.2-6.9-5-4.8 7-1z"/>',
      'Resistente': '<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/>',
      'Estilo': '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>'
    };
    function iconoFeature(nombre) {
      const forma = ICONOS_FEATURE[nombre] || '<path d="M20 6L9 17l-5-5"/>';
      return `<svg viewBox="0 0 24 24" aria-hidden="true">${forma}</svg>`;
    }

    function getBgColor(name, idx) {
      const n = name.toLowerCase();
      for (const [k,v] of Object.entries(COLOR_BG)) { if (n.includes(k)) return v; }
      return ['#ddd3b0','#cacdd6','#eacfcb','#e0dcd4','#bfcfb8','#cfc8e0'][idx % 6];
    }
    function getSwatchColor(name, idx) {
      // Con barra ("Gris / Verde") manda el último color, el de la visera.
      // Sin barra ("Gris negro") manda el primero que se nombra; el blanco solo si no hay otro.
      const partes = name.toLowerCase().split('/').map(s => s.trim()).reverse();
      for (const parte of partes) {
        const encontrados = Object.entries(COLOR_SWATCH)
          .map(([k, v]) => ({ pos: parte.indexOf(k), v, blanco: k === 'blanco' || k === 'white' }))
          .filter(x => x.pos >= 0)
          .sort((a, b) => (a.blanco - b.blanco) || (a.pos - b.pos));
        if (encontrados.length) return encontrados[0].v;
      }
      return ['#c4aa78','#7a8898','#dc8888','#d5d0c8','#6a9858','#9878c0'][idx % 6];
    }

    // Color de fondo leído de las esquinas de la foto (la foto tiene su propio fondo liso)
    const colorFotoCache = {};
    function colorDeFoto(src) {
      if (colorFotoCache[src]) return Promise.resolve(colorFotoCache[src]);
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
          try {
            const c = document.createElement('canvas');
            c.width = img.naturalWidth; c.height = img.naturalHeight;
            const ctx = c.getContext('2d');
            ctx.drawImage(img, 0, 0);
            const w = c.width, h = c.height;
            let r = 0, g = 0, b = 0;
            [[6, 6], [w - 7, 6], [6, h / 2], [w - 7, h / 2]].forEach(([x, y]) => {
              const d = ctx.getImageData(x, y, 1, 1).data; r += d[0]; g += d[1]; b += d[2];
            });
            colorFotoCache[src] = `rgb(${Math.round(r / 4)},${Math.round(g / 4)},${Math.round(b / 4)})`;
            resolve(colorFotoCache[src]);
          } catch (e) { resolve(null); }
        };
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    // ── ESTADO ─────────────────────────────────────────────────────
    let productoActual = null;
    let variantActual = 0;
    let fotoIdx = 0;
    let stockCargado = false;

    function getFotos(v) {
      if (v?.fotos?.length) return v.fotos;
      return v?.foto ? [v.foto] : ['img/logo.png'];
    }

    function initCarousel(v) {
      fotoIdx = 0;
      const fotos = getFotos(v);
      const strip = document.getElementById('thumb-strip');
      const dotsM = document.getElementById('carousel-dots-mobile');
      if (!strip) return;

      if (fotos.length <= 1) {
        strip.classList.add('hidden');
        if (dotsM) dotsM.innerHTML = '';
        return;
      }

      strip.classList.remove('hidden');
      strip.innerHTML = fotos.map((f, i) =>
        `<div class="thumb-item ${i===0?'active':''}" onclick="irFoto(${i})">
           <img src="${f}" alt="foto ${i+1}" loading="lazy" />
         </div>`
      ).join('');

      if (dotsM) {
        dotsM.innerHTML = fotos.map((_, i) =>
          `<span class="carousel-dot ${i===0?'active':''}" onclick="irFoto(${i})"></span>`
        ).join('');
      }
    }

    function irFoto(idx) {
      const v = productoActual?.variantes[variantActual];
      const fotos = getFotos(v);
      fotoIdx = idx;
      actualizarFotoCarrusel(fotos);
    }

    function actualizarFotoCarrusel(fotos) {
      const img = document.getElementById('product-main-img');
      if (img) {
        img.classList.add('fading');
        setTimeout(() => {
          img.src = fotos[fotoIdx] || 'img/logo.png';
          img.classList.remove('fading');
        }, 280);
      }
      document.querySelectorAll('.thumb-item').forEach((t, i) => t.classList.toggle('active', i === fotoIdx));
      document.querySelectorAll('.carousel-dot').forEach((d, i) => d.classList.toggle('active', i === fotoIdx));
    }

    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');
    const initialVariant = Math.max(0, parseInt(params.get('v') || '0') || 0);

    if (!productId) { window.location.href = 'index.html'; }
    else {
      db.ref('productos/' + productId).once('value', snap => {
        if (!snap.exists()) { window.location.href = 'index.html'; return; }
        productoActual = { id: snap.key, ...snap.val() };
        // Actualizar STOCK_MAP igual que el catálogo: v.stockId o prod.id + '-' + i como fallback
        (productoActual.variantes || []).forEach((v, i) => {
          STOCK_MAP[productoActual.nombre + '-' + v.nombre] = v.stockId || (productoActual.id + '-' + i);
        });
        renderProducto(productoActual, initialVariant);
        cargarRelacionados(productoActual);
        // Cargar stock en cadena, luego registrar listener en tiempo real
        db.ref('stock').once('value', stockSnap => {
          const data = stockSnap.val() || {};
          Object.values(STOCK_MAP).forEach(id => { stockCache[id] = 0; });
          // Pre-init stockIds propios del producto
          (productoActual.variantes || []).forEach(v => { if (v.stockId) stockCache[v.stockId] = 0; });
          Object.keys(data).forEach(id => { stockCache[id] = data[id]; });
          stockCargado = true;
          actualizarBtnStock(productoActual.variantes[variantActual]);
          // Listener tiempo real para cambios de stock posteriores
          db.ref('stock').on('value', (snapshot) => {
            const data2 = snapshot.val() || {};
            Object.values(STOCK_MAP).forEach(id => { stockCache[id] = 0; });
            (productoActual.variantes || []).forEach(v => { if (v.stockId) stockCache[v.stockId] = 0; });
            Object.keys(data2).forEach(id => { stockCache[id] = data2[id]; });
            if (productoActual) actualizarBtnStock(productoActual.variantes[variantActual]);
          });
        });
      });
    }

    // ── RENDER ─────────────────────────────────────────────────────
    function renderProducto(prod, vIdx) {
      const variantes = prod.variantes || [];
      if (!variantes.length) return;
      variantActual = Math.min(vIdx, variantes.length - 1);

      const features = FEATURES_MAP[prod.categoria] || FEATURES_MAP.default;
      const page = document.getElementById('product-page');

      page.innerHTML = `
        <!-- Panel izquierdo -->
        <div class="product-left">
          <div class="product-bg" id="product-bg"></div>
          <div class="product-bg-overlay"></div>
          <div class="product-left-inner">
            <div class="thumb-strip hidden" id="thumb-strip"></div>
            <div class="product-img-container">
              <img class="product-main-img" id="product-main-img"
                   src="${getFotos(variantes[variantActual])[0]||'img/logo.png'}"
                   alt="${prod.nombre} ${variantes[variantActual]?.nombre||''}" />
              <div class="carousel-dots-mobile" id="carousel-dots-mobile"></div>
            </div>
          </div>
        </div>

        <!-- Panel derecho -->
        <div class="product-right">
          <div class="product-breadcrumb">${prod.categoria||'Colección'} · ${prod.subgrupo||prod.nombre}</div>
          <h1 class="product-title">${prod.nombre}</h1>
          <p class="product-subtitle">${variantes.length} color${variantes.length>1?'es':''} · Talle único ajustable</p>
          <div class="product-price">
            <span class="currency">$UY</span> ${(variantes[variantActual]?.precio||prod.precio||0).toLocaleString()}
          </div>
          <div class="color-section">
            <p class="color-label">Color — <span id="color-name">${variantes[variantActual]?.nombre||''}</span></p>
            <div class="color-swatches">
              ${variantes.map((v,i) => `
                <div class="swatch ${i===variantActual?'active':''}"
                     style="background:${getSwatchColor(v.nombre,i)}"
                     title="${v.nombre}"
                     onclick="selectVariant(${i})"></div>
              `).join('')}
            </div>
          </div>
          <div class="divider"></div>
          <div class="added-feedback" id="added-feedback">✓ Agregado al carrito</div>
          <button type="button" class="btn-add-cart-detail" onclick="agregarAlCarrito()">Agregar al carrito</button>
          <a class="btn-whatsapp-detail" href="#" onclick="consultarWA(event)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" opacity="0.6"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            Consultar por WhatsApp
          </a>
          <div class="product-features">
            ${features.map(f=>`<div class="feature-item">${iconoFeature(f.l)}<span>${f.l}</span></div>`).join('')}
          </div>
          <div class="product-shipping">
            <div class="envio-linea"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg><div><b>Montevideo</b> <span>· Envío a domicilio $200</span></div></div>
            <div class="envio-linea"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><div><b>Interior</b> <span>· Por agencia, a cargo del comprador</span></div></div>
            <div class="envio-linea"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><div><b>Retiro gratis</b> <span>· Cordón, coordinando antes</span></div></div>
          </div>
        </div>
      `;

      document.title = `${prod.nombre} | Sendera`;
      actualizarFondo(prod, variantActual);
      initCarousel(variantes[variantActual]);
      actualizarBtnStock(variantes[variantActual]);
    }

    // ── TAMBIÉN TE PUEDE GUSTAR ───────────────────────────────────
    // Otros productos de la misma categoría (un color por tarjeta); si no hay, de cualquier categoría
    function cargarRelacionados(prod) {
      db.ref('productos').once('value', snap => {
        const todos = [];
        snap.forEach(c => { todos.push({ id: c.key, ...c.val() }); });
        const otros = todos.filter(p => p.id !== prod.id);
        const misma = otros.filter(p => p.categoria === prod.categoria);
        const lista = (misma.length ? misma : otros)
          .sort((a, b) => (a.orden || 999) - (b.orden || 999))
          .flatMap(p => (p.variantes || []).map((v, i) => ({ p, v, i, foto: getFotos(v)[0] })))
          .filter(x => x.foto && x.foto !== 'img/logo.png')
          .slice(0, 12);
        if (!lista.length) return;
        document.getElementById('relacionados-track').innerHTML = lista.map(({ p, v, i, foto }) => `
          <a class="rel-card" href="producto.html?id=${p.id}&v=${i}">
            <img src="${foto}" alt="${p.nombre} ${v.nombre}" loading="lazy" />
            <b>${p.nombre}</b>
            <span>${v.nombre} · $${(v.precio || p.precio || 0).toLocaleString()}</span>
          </a>`).join('');
        document.getElementById('relacionados').style.display = '';
      });
    }

    window.relacionadosMover = function(dir) {
      const t = document.getElementById('relacionados-track');
      t.scrollBy({ left: dir * (t.clientWidth + 18), behavior: 'smooth' });
    };

    // ── FONDO (avatar desenfocado o color) ─────────────────────────
    function actualizarFondo(prod, idx) {
      const variantes = prod.variantes || [];
      const v = variantes[idx];
      const bgEl = document.getElementById('product-bg');
      if (!bgEl) return;

      const bgColor = getBgColor(v?.nombre || '', idx);
      document.body.style.background = bgColor;
      const foto = getFotos(v)[0];
      if (foto && foto !== 'img/logo.png') {
        colorDeFoto(foto).then(c => {
          if (!c || productoActual?.variantes[variantActual] !== v) return;
          document.documentElement.style.setProperty('--prod-bg', c);
          document.body.style.background = c;
        });
      }

      // Si el producto tiene foto de avatar (lifestyle), la usamos desenfocada
      if (prod.fotoAvatar) {
        bgEl.style.backgroundImage = `url('${prod.fotoAvatar}')`;
        bgEl.style.opacity = '0.55';
      } else if (v?.foto) {
        // Fallback: la misma foto del producto pero desenfocada
        bgEl.style.backgroundImage = `url('${v.foto}')`;
        bgEl.style.opacity = '0.4';
      } else {
        bgEl.style.backgroundImage = 'none';
        bgEl.style.opacity = '0';
      }
    }

    // ── CAMBIAR VARIANTE ───────────────────────────────────────────
    function selectVariant(idx) {
      if (!productoActual || idx === variantActual) return;
      variantActual = idx;
      const v = productoActual.variantes[idx];

      // Imagen con fade + reiniciar carrusel
      fotoIdx = 0;
      const fotos = getFotos(v);
      const img = document.getElementById('product-main-img');
      if (img) {
        img.classList.add('fading');
        setTimeout(() => {
          img.src = fotos[0] || 'img/logo.png';
          img.alt = productoActual.nombre + ' ' + v.nombre;
          img.classList.remove('fading');
        }, 280);
      }
      initCarousel(v);

      // Labels
      const cn = document.getElementById('color-name');
      if (cn) cn.textContent = v.nombre;

      // Precio
      const pe = document.querySelector('.product-price');
      if (pe) pe.innerHTML = `<span class="currency">$UY</span> ${(v.precio||productoActual.precio||0).toLocaleString()}`;

      // Dots y swatches activos
      document.querySelectorAll('.color-dot').forEach((d,i) => d.classList.toggle('active', i===idx));
      document.querySelectorAll('.swatch').forEach((s,i) => s.classList.toggle('active', i===idx));

      // Fondo
      actualizarFondo(productoActual, idx);

      // Stock del botón
      actualizarBtnStock(v);

      // Ocultar feedback
      const fb = document.getElementById('added-feedback');
      if (fb) fb.classList.remove('visible');
    }

    // ── CARRITO ─────────────────────────────────────────────────────
    function actualizarBtnStock(v) {
      const addBtn = document.querySelector('.btn-add-cart-detail');
      if (!addBtn || !v || !productoActual) return;
      if (!stockCargado) { addBtn.disabled = true; return; }
      const stockId = v.stockId || STOCK_MAP[productoActual.nombre + '-' + v.nombre];
      const sinStock = stockId !== undefined && getStock(stockId) <= 0;
      addBtn.disabled = sinStock;
      addBtn.textContent = sinStock ? 'Sin stock' : 'Agregar al carrito';
      addBtn.style.background = sinStock ? '#aaa' : '';
      addBtn.style.cursor = sinStock ? 'not-allowed' : '';
    }

    function agregarAlCarrito() {
      if (!productoActual) return;
      const v = productoActual.variantes[variantActual];
      if (!v) return;
      const stockId = STOCK_MAP[productoActual.nombre + '-' + v.nombre];
      if (stockId !== undefined && (!stockCargado || getStock(stockId) <= 0)) return;
      const existing = cart.find(i => i.name === productoActual.nombre && i.variant === v.nombre);
      if (existing) { existing.qty++; } else {
        cart.push({ name: productoActual.nombre, variant: v.nombre, price: v.precio || productoActual.precio || 0, qty: 1 });
      }
      saveCart();
      updateCartUI();
      const addBtn = document.querySelector('.btn-add-cart-detail');
      if (addBtn) {
        addBtn.textContent = '✓ Agregado!';
        addBtn.style.background = '#3d5e2c';
        setTimeout(() => {
          addBtn.textContent = 'Agregar al carrito';
          addBtn.style.background = '';
        }, 1800);
      }
    }


    function consultarWA(e) {
      e.preventDefault();
      if (!productoActual) return;
      const v = productoActual.variantes[variantActual];
      const msg = encodeURIComponent(`Hola! Me interesa el ${productoActual.nombre} en color ${v?.nombre||''}. ¿Tienen stock? 🎩`);
      window.open(`https://wa.me/59895290959?text=${msg}`, '_blank');
    }

    function pagarMP() {
      if (cart.length === 0) { alert('Agregá productos al carrito primero.'); return; }
      const data = { items: cart.map(i => ({ nombre: i.name, variante: i.variant, precio: i.price, qty: i.qty })), envio: getEnvio() };
      sessionStorage.setItem('sendera_pedido', JSON.stringify(data));
      window.location.href = 'checkout.html';
    }

    // ── SWIPE TÁCTIL EN MOBILE ──────────────────────────────────────
    (function() {
      let startX = 0;
      const imgContainer = document.getElementById('product-page');
      document.addEventListener('touchstart', function(e) {
        const t = e.touches[0];
        const el = document.elementFromPoint(t.clientX, t.clientY);
        if (el && el.closest('.product-left')) startX = t.clientX;
        else startX = 0;
      }, { passive: true });
      document.addEventListener('touchend', function(e) {
        if (!startX) return;
        const dx = e.changedTouches[0].clientX - startX;
        if (Math.abs(dx) < 40) return;
        if (!productoActual) return;
        const v = productoActual.variantes[variantActual];
        const fotos = getFotos(v);
        if (fotos.length <= 1) return;
        if (dx < 0) irFoto(Math.min(fotoIdx + 1, fotos.length - 1));
        else irFoto(Math.max(fotoIdx - 1, 0));
        startX = 0;
      }, { passive: true });
    })();
  </script>
</body>
</html>
