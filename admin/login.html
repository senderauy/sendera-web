<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" href="../img/logo.png" />
  <link rel="icon" type="image/png" href="../img/logo.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sendera Admin" />
  <meta name="theme-color" content="#f2ede6" />
  <title>Sendera Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="../firebase-config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f2ede6;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(120,153,100,0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(180,140,90,0.1) 0%, transparent 50%);
      padding: 20px;
    }

    .login-wrap {
      width: 100%;
      max-width: 420px;
    }

    /* Encabezado */
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-icon {
      font-size: 2.8rem;
      margin-bottom: 10px;
      display: block;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      color: #3a3026;
      letter-spacing: 0.18em;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.7rem;
      color: #7a6e62;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    /* Card */
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      box-shadow: 0 4px 24px rgba(80,60,30,0.1), 0 1px 4px rgba(80,60,30,0.06);
      border: 1px solid rgba(180,155,100,0.15);
    }

    .card-title {
      font-size: 0.72rem;
      color: #9a8f82;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 28px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: #6b5f54;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      background: #faf8f4;
      border: 1.5px solid #ddd5c8;
      border-radius: 10px;
      color: #3a3026;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder { color: #c0b5a8; }

    input:focus {
      border-color: #a07d45;
      box-shadow: 0 0 0 3px rgba(160,125,69,0.1);
    }

    .btn-login {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #6b8f52, #507a3a);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 28px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #7aa35e, #5c8b44);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(80,122,58,0.3);
    }

    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.7; cursor: default; transform: none; box-shadow: none; }

    .btn-link {
      display: block;
      width: 100%;
      margin-top: 16px;
      background: none;
      border: none;
      color: #7a6e62;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.72rem;
      text-decoration: underline;
      cursor: pointer;
    }

    .msg {
      display: none;
      border-radius: 8px;
      font-size: 0.78rem;
      line-height: 1.5;
      padding: 10px 14px;
      margin-top: 14px;
      text-align: center;
      overflow-wrap: anywhere;
    }
    .msg.error { background: #fff5f5; border: 1px solid #fca5a5; color: #b91c1c; }
    .msg.info { background: #f0faf4; border: 1px solid #b8dba8; color: #2d6a4f; }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.68rem;
      color: #b0a598;
      letter-spacing: 0.08em;
    }

    /* Mobile */
    @media (max-width: 480px) {
      .login-card {
        padding: 32px 24px;
        border-radius: 14px;
      }
      .logo { font-size: 1.9rem; }
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-header">
      <div class="logo">SENDERA</div>
      <div class="subtitle">Equipamiento outdoor · Uruguay</div>
    </div>

    <div class="login-card">
      <div class="card-title">Panel de administración</div>

      <form onsubmit="event.preventDefault(); enviar();">
        <div class="form-group">
          <label for="email">✉️ Email</label>
          <input type="email" id="email" placeholder="Tu email" autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">🔒 Contraseña</label>
          <input type="password" id="password" placeholder="Tu contraseña" autocomplete="current-password" />
        </div>

        <button type="submit" class="btn-login" id="btn-login">🌿 Ingresar al panel</button>
        <button type="button" class="btn-link" id="btn-olvide" onclick="recuperar()">¿Olvidaste tu contraseña?</button>
        <button type="button" class="btn-link" id="btn-modo" onclick="cambiarModo()">¿Primera vez? Creá tu contraseña</button>
      </form>
      <div class="msg" id="login-msg" role="alert"></div>
    </div>

    <div class="login-footer">sendera · admin v2.0</div>
  </div>

  <script>
    const btn = document.getElementById('btn-login');
    const msg = document.getElementById('login-msg');
    const TEXTO_INGRESAR = '🌿 Ingresar al panel';
    const TEXTO_CREAR = '🌿 Crear contraseña';
    let modoCrear = false;

    firebase.auth().languageCode = 'es';

    function mostrarMensaje(texto, tipo = 'error') {
      msg.textContent = texto;
      msg.className = 'msg ' + tipo;
      msg.style.display = 'block';
    }

    function textoError(e) {
      const textos = {
        'auth/invalid-email': 'Ese email no es válido.',
        'auth/email-already-in-use': 'Ese mail ya tiene contraseña. Entrá con ella o tocá "¿Olvidaste tu contraseña?".',
        'auth/too-many-requests': 'Demasiados intentos. Esperá unos minutos y probá de nuevo.',
        'auth/network-request-failed': 'No hay conexión. Revisá internet y probá de nuevo.'
      };
      return textos[e.code] || (modoCrear ? 'No se pudo crear la contraseña. Probá de nuevo.' : 'Email o contraseña incorrectos.');
    }

    // Las claves de la base no admiten puntos, por eso el mail se guarda con comas
    function claveAdmin(email) {
      return (email || '').toLowerCase().replace(/\./g, ',');
    }

    // Por REST con el token del usuario: justo después de ingresar, la conexión de la base puede no tener la sesión todavía
    async function esAdmin(user) {
      try {
        const token = await user.getIdToken();
        const res = await fetch(`${firebaseConfig.databaseURL}/admins/${encodeURIComponent(claveAdmin(user.email))}.json?auth=${token}`);
        return res.ok && (await res.json()) === true;
      } catch {
        return false;
      }
    }

    const dejarDeEscuchar = firebase.auth().onAuthStateChanged(async user => {
      dejarDeEscuchar();
      if (user && user.emailVerified && await esAdmin(user)) location.replace('dashboard.html');
    });

    function cambiarModo() {
      modoCrear = !modoCrear;
      btn.textContent = modoCrear ? TEXTO_CREAR : TEXTO_INGRESAR;
      document.getElementById('btn-modo').textContent = modoCrear ? 'Ya tengo contraseña' : '¿Primera vez? Creá tu contraseña';
      document.getElementById('btn-olvide').style.display = modoCrear ? 'none' : '';
      const pass = document.getElementById('password');
      pass.placeholder = modoCrear ? 'Contraseña nueva (mínimo 8 caracteres)' : 'Tu contraseña';
      pass.autocomplete = modoCrear ? 'new-password' : 'current-password';
      msg.style.display = 'none';
    }

    async function enviar() {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      if (!email || !pass) return mostrarMensaje('Completá el email y la contraseña.');
      if (modoCrear && pass.length < 8) return mostrarMensaje('Usá una contraseña de al menos 8 caracteres.');
      btn.disabled = true;
      btn.textContent = modoCrear ? 'Creando…' : 'Ingresando…';
      try {
        const { user } = modoCrear
          ? await firebase.auth().createUserWithEmailAndPassword(email, pass)
          : await firebase.auth().signInWithEmailAndPassword(email, pass);
        if (!(await esAdmin(user))) {
          await firebase.auth().signOut();
          mostrarMensaje('Esta cuenta no tiene acceso al panel.');
        } else if (!user.emailVerified) {
          await user.sendEmailVerification();
          await firebase.auth().signOut();
          if (modoCrear) cambiarModo();
          mostrarMensaje('Te mandamos un mail a ' + user.email + ' para confirmar que la cuenta es tuya. Tocá el link y después entrá acá con tu mail y tu contraseña.', 'info');
        } else {
          return location.replace('dashboard.html');
        }
      } catch (e) {
        const mensaje = textoError(e);
        if (e.code === 'auth/email-already-in-use') cambiarModo();
        mostrarMensaje(mensaje);
      } finally {
        btn.disabled = false;
        btn.textContent = modoCrear ? TEXTO_CREAR : TEXTO_INGRESAR;
      }
    }

    async function recuperar() {
      const email = document.getElementById('email').value.trim();
      if (!email) return mostrarMensaje('Escribí tu email arriba y volvé a tocar "¿Olvidaste tu contraseña?".');
      try {
        await firebase.auth().sendPasswordResetEmail(email);
        mostrarMensaje('Si ese email tiene cuenta, te llegó un correo para crear una contraseña nueva.', 'info');
      } catch (e) {
        mostrarMensaje(e.code === 'auth/invalid-email' ? 'Ese email no es válido.' : 'No se pudo enviar el correo. Probá de nuevo.');
      }
    }
  </script>
</body>
</html>
