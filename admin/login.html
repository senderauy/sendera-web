<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" href="../img/logo.png" />
  <link rel="icon" type="image/png" href="../img/logo.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sendera Admin" />
  <meta name="theme-color" content="#182417" />
  <title>Sendera - Ingresar</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="../firebase-config.js"></script>
  <link rel="stylesheet" href="admin.css?v=1" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
      background: var(--sa-noche); color: var(--sa-tinta); font-family: var(--sa-sans); font-size: 14px; line-height: 1.5;
    }
    :focus-visible { outline: 2px solid var(--sa-ambar); outline-offset: 2px; }
    .entrada { width: 100%; max-width: 400px; }
    .marca { display: block; width: auto; height: 84px; margin: 0 auto 28px; }
    .tarjeta { background: var(--sa-papel); border-radius: 20px; padding: 32px 30px 26px; }
    .tarjeta h1 { font: 600 2rem/1.1 var(--sa-serif); }
    .tarjeta > p { margin-top: 6px; color: var(--sa-tinta-3); font-size: 0.86rem; }
    form { display: flex; flex-direction: column; gap: 14px; margin-top: 24px; }
    label { display: block; margin-bottom: 6px; font-size: 0.8rem; font-weight: 500; color: var(--sa-tinta-2); }
    .sa-campo { padding: 12px 14px; font-size: 0.95rem; }
    .btn-login { width: 100%; margin-top: 8px; padding: 13px 16px; font-size: 0.9rem; }
    .btn-link { display: block; width: 100%; padding: 6px; background: none; border: 0; color: var(--sa-tinta-2); font: 500 0.82rem var(--sa-sans); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .btn-link:hover { color: var(--sa-tinta); }
    .enlaces { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
    .msg { display: none; margin-top: 16px; padding: 10px 12px; border-radius: 10px; font-size: 0.84rem; line-height: 1.5; overflow-wrap: anywhere; }
    .msg.error { background: var(--sa-rojo-fondo); color: var(--sa-rojo); }
    .msg.info { background: var(--sa-verde-fondo); color: var(--sa-verde); }
    .pie { margin-top: 22px; text-align: center; color: var(--sa-noche-tenue); font-size: 0.78rem; }
    @media (max-width: 480px) {
      .tarjeta { padding: 26px 20px 20px; border-radius: 18px; }
      .marca { height: 70px; margin-bottom: 22px; }
    }
  </style>
</head>
<body>
  <main class="entrada">
    <img class="marca" src="../img/logo-crema.png" alt="Sendera" />

    <div class="tarjeta">
      <h1>Panel de Sendera</h1>
      <p>Entrá con el mail y la contraseña de administrador.</p>

      <form onsubmit="event.preventDefault(); enviar();">
        <div>
          <label for="email">Email</label>
          <input class="sa-campo" type="email" id="email" placeholder="tu@mail.com" autocomplete="username" />
        </div>
        <div>
          <label for="password">Contraseña</label>
          <input class="sa-campo" type="password" id="password" placeholder="Tu contraseña" autocomplete="current-password" />
        </div>
        <button type="submit" class="sa-boton btn-login" id="btn-login">Ingresar al panel</button>
        <div class="enlaces">
          <button type="button" class="btn-link" id="btn-olvide" onclick="recuperar()">¿Olvidaste tu contraseña?</button>
          <button type="button" class="btn-link" id="btn-modo" onclick="cambiarModo()">¿Primera vez? Creá tu contraseña</button>
        </div>
      </form>
      <div class="msg" id="login-msg" role="alert"></div>
    </div>

    <p class="pie">Solo para el equipo de Sendera</p>
  </main>

  <script>
    const btn = document.getElementById('btn-login');
    const msg = document.getElementById('login-msg');
    const TEXTO_INGRESAR = 'Ingresar al panel';
    const TEXTO_CREAR = 'Crear contraseña';
    let modoCrear = false;

    firebase.auth().languageCode = 'es';

    function mostrarMensaje(texto, tipo = 'error') {
      msg.textContent = texto;
      msg.className = 'msg ' + tipo;
      msg.style.display = 'block';
    }

    function textoError(e) {
      const textos = {
        'auth/invalid-email': 'Ese email no es válido.',
        'auth/email-already-in-use': 'Ese mail ya tiene contraseña. Entrá con ella o tocá "¿Olvidaste tu contraseña?".',
        'auth/too-many-requests': 'Demasiados intentos. Esperá unos minutos y probá de nuevo.',
        'auth/network-request-failed': 'No hay conexión. Revisá internet y probá de nuevo.'
      };
      return textos[e.code] || (modoCrear ? 'No se pudo crear la contraseña. Probá de nuevo.' : 'Email o contraseña incorrectos.');
    }

    // Las claves de la base no admiten puntos, por eso el mail se guarda con comas
    function claveAdmin(email) {
      return (email || '').toLowerCase().replace(/\./g, ',');
    }

    // Por REST con el token del usuario: justo después de ingresar, la conexión de la base puede no tener la sesión todavía
    async function esAdmin(user) {
      try {
        const token = await user.getIdToken();
        const res = await fetch(`${firebaseConfig.databaseURL}/admins/${encodeURIComponent(claveAdmin(user.email))}.json?auth=${token}`);
        return res.ok && (await res.json()) === true;
      } catch {
        return false;
      }
    }

    const dejarDeEscuchar = firebase.auth().onAuthStateChanged(async user => {
      dejarDeEscuchar();
      if (user && user.emailVerified && await esAdmin(user)) location.replace('dashboard.html');
    });

    function cambiarModo() {
      modoCrear = !modoCrear;
      btn.textContent = modoCrear ? TEXTO_CREAR : TEXTO_INGRESAR;
      document.getElementById('btn-modo').textContent = modoCrear ? 'Ya tengo contraseña' : '¿Primera vez? Creá tu contraseña';
      document.getElementById('btn-olvide').style.display = modoCrear ? 'none' : '';
      const pass = document.getElementById('password');
      pass.placeholder = modoCrear ? 'Contraseña nueva (mínimo 8 caracteres)' : 'Tu contraseña';
      pass.autocomplete = modoCrear ? 'new-password' : 'current-password';
      msg.style.display = 'none';
    }

    async function enviar() {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      if (!email || !pass) return mostrarMensaje('Completá el email y la contraseña.');
      if (modoCrear && pass.length < 8) return mostrarMensaje('Usá una contraseña de al menos 8 caracteres.');
      btn.disabled = true;
      btn.textContent = modoCrear ? 'Creando…' : 'Ingresando…';
      try {
        const { user } = modoCrear
          ? await firebase.auth().createUserWithEmailAndPassword(email, pass)
          : await firebase.auth().signInWithEmailAndPassword(email, pass);
        if (!(await esAdmin(user))) {
          await firebase.auth().signOut();
          mostrarMensaje('Esta cuenta no tiene acceso al panel.');
        } else if (!user.emailVerified) {
          await user.sendEmailVerification();
          await firebase.auth().signOut();
          if (modoCrear) cambiarModo();
          mostrarMensaje('Te mandamos un mail a ' + user.email + ' para confirmar que la cuenta es tuya. Tocá el link y después entrá acá con tu mail y tu contraseña.', 'info');
        } else {
          return location.replace('dashboard.html');
        }
      } catch (e) {
        const mensaje = textoError(e);
        if (e.code === 'auth/email-already-in-use') cambiarModo();
        mostrarMensaje(mensaje);
      } finally {
        btn.disabled = false;
        btn.textContent = modoCrear ? TEXTO_CREAR : TEXTO_INGRESAR;
      }
    }

    async function recuperar() {
      const email = document.getElementById('email').value.trim();
      if (!email) return mostrarMensaje('Escribí tu email arriba y volvé a tocar "¿Olvidaste tu contraseña?".');
      try {
        await firebase.auth().sendPasswordResetEmail(email);
        mostrarMensaje('Si ese email tiene cuenta, te llegó un correo para crear una contraseña nueva.', 'info');
      } catch (e) {
        mostrarMensaje(e.code === 'auth/invalid-email' ? 'Ese email no es válido.' : 'No se pudo enviar el correo. Probá de nuevo.');
      }
    }
  </script>
</body>
</html>
