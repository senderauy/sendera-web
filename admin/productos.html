<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" href="../img/logo.png" />
  <link rel="icon" type="image/png" href="../img/logo.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sendera Admin" />
  <meta name="theme-color" content="#182417" />
  <title>Sendera - Productos</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="../firebase-config.js"></script>
  <script src="admin-auth.js?v=2"></script>
  <link rel="stylesheet" href="admin.css?v=1" />
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="admin-ui.js?v=1"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { min-height: 100vh; font-size: 14px; line-height: 1.5; }
    button, input, select, textarea { font-family: inherit; }

    .herramientas { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    /* Catálogo */
    .catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
    .catalogo > .sa-vacio { grid-column: 1 / -1; background: var(--sa-papel); border: 1px solid var(--sa-linea); border-radius: 16px; }
    .catalogo > .sa-vacio .sa-boton { margin-top: 12px; }
    .producto { display: flex; flex-direction: column; padding: 0; text-align: left; border: 1px solid var(--sa-linea); border-radius: 16px; background: var(--sa-papel); overflow: hidden; cursor: pointer; color: inherit; font-size: inherit; transition: border-color 0.15s; }
    .producto:hover { border-color: var(--sa-tinta-3); }
    .producto .foto { position: relative; display: block; aspect-ratio: 4 / 3; overflow: hidden; background: var(--sa-papel-2); }
    .producto .foto img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .producto .sin-foto { display: grid; place-items: center; height: 100%; color: var(--sa-tinta-3); }
    .producto .sin-foto .lucide { width: 28px; height: 28px; }
    .etiquetas { position: absolute; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    .etiqueta { padding: 3px 9px; border-radius: 999px; background: rgba(255, 253, 248, 0.94); color: var(--sa-tinta); font-size: 0.72rem; font-weight: 600; }
    .etiqueta.oferta { background: var(--sa-ambar); color: #fff; }
    .producto .info { display: flex; flex-direction: column; gap: 3px; padding: 14px 16px 16px; }
    .producto .info small { color: var(--sa-tinta-3); font-size: 0.76rem; }
    .producto .info b { font-size: 0.98rem; font-weight: 600; }
    .muestras { display: flex; align-items: center; margin-top: 6px; }
    .muestras img, .muestras .punto { width: 22px; height: 22px; margin-right: -5px; border-radius: 50%; object-fit: cover; border: 2px solid var(--sa-papel); background: var(--sa-linea-2); }
    .muestras em { margin-left: 12px; font-style: normal; font-size: 0.76rem; color: var(--sa-tinta-3); }
    .producto .precio { margin-top: 8px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .producto .precio s { margin-right: 6px; color: var(--sa-tinta-3); font-weight: 400; }

    /* Editor */
    .velo-editor { position: fixed; inset: 0; z-index: 40; background: rgba(24, 20, 14, 0.32); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .velo-editor.visible { opacity: 1; pointer-events: auto; }
    .editor {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 50; width: min(560px, 100%);
      display: flex; flex-direction: column; background: var(--sa-papel); border-left: 1px solid var(--sa-linea);
      transform: translateX(100%); visibility: hidden;
      transition: transform 0.28s cubic-bezier(.2, .8, .2, 1), visibility 0s linear 0.28s;
    }
    .editor.abierto { transform: translateX(0); visibility: visible; transition: transform 0.28s cubic-bezier(.2, .8, .2, 1), visibility 0s; }
    .editor > header { display: flex; align-items: center; gap: 12px; padding: 22px 24px 16px; border-bottom: 1px solid var(--sa-linea-2); }
    .editor > header > div { min-width: 0; }
    .editor h2 { font: 600 1.6rem/1.1 var(--sa-serif); overflow-wrap: anywhere; }
    .editor > header a { display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; font-size: 0.8rem; color: var(--sa-tinta-2); text-decoration: none; }
    .editor > header a:hover { color: var(--sa-tinta); }
    .editor > header a .lucide { width: 14px; height: 14px; }
    .editor .cerrar { margin-left: auto; color: var(--sa-tinta-2); }
    .editor .cerrar:hover { color: var(--sa-tinta); }
    .editor .cuerpo { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 20px 24px 28px; display: flex; flex-direction: column; gap: 28px; }
    .editor section { display: flex; flex-direction: column; gap: 12px; }
    .editor h3 { font-size: 0.8rem; font-weight: 600; color: var(--sa-tinta-3); }
    .campo > span { display: block; margin-bottom: 6px; font-size: 0.8rem; font-weight: 500; color: var(--sa-tinta-2); }
    .campo > span i { font-style: normal; font-weight: 400; color: var(--sa-tinta-3); }
    .ayuda { display: block; margin-top: 5px; font-size: 0.76rem; color: var(--sa-tinta-3); }
    .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .opcion { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 0; border-top: 1px solid var(--sa-linea-2); font-size: 0.88rem; cursor: pointer; }
    .opcion small { display: block; color: var(--sa-tinta-3); font-size: 0.76rem; }
    .titulo-seccion { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .boton-chico { padding: 7px 12px; font-size: 0.8rem; }

    .ambiente { display: flex; align-items: center; gap: 14px; }
    .ambiente img, .ambiente .vacia { width: 96px; height: 72px; border-radius: 10px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--sa-linea); }
    .ambiente .vacia { display: grid; place-items: center; background: var(--sa-papel-2); color: var(--sa-tinta-3); }
    .ambiente > div { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }

    .variante { display: flex; flex-direction: column; gap: 12px; padding: 14px; border: 1px solid var(--sa-linea); border-radius: 14px; background: var(--sa-papel-2); }
    .variante-datos { display: grid; grid-template-columns: minmax(0, 1fr) 104px 84px 34px; gap: 10px; align-items: end; }
    .variante-datos .sa-icono-btn { margin-bottom: 2px; }
    .fotos { display: flex; flex-wrap: wrap; gap: 8px; }
    .foto-celda { position: relative; width: 68px; height: 68px; }
    .foto-tile { display: block; width: 100%; height: 100%; border-radius: 10px; overflow: hidden; border: 1px solid var(--sa-linea); background: var(--sa-papel); cursor: pointer; transition: transform 0.15s; }
    .foto-tile img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .foto-tile:focus-visible { outline: 2px solid var(--sa-ambar); outline-offset: 2px; }
    .foto-celda.elegida .foto-tile { outline: 3px solid var(--sa-ambar); outline-offset: 2px; transform: scale(0.94); }
    .foto-celda.encima .foto-tile { outline: 2px dashed var(--sa-tinta); outline-offset: 2px; }
    .foto-celda.arrastrando { opacity: 0.4; }
    .foto-celda .quitar { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; display: grid; place-items: center; border: 0; border-radius: 50%; background: rgba(24, 20, 14, 0.72); color: #fff; cursor: pointer; }
    .foto-celda .quitar .lucide { width: 13px; height: 13px; }
    .foto-celda .principal { position: absolute; left: 4px; bottom: 4px; padding: 1px 6px; border-radius: 999px; background: rgba(24, 20, 14, 0.72); color: #fff; font-size: 0.62rem; font-weight: 600; pointer-events: none; }
    [data-pista]:empty { display: none; }
    .pista-fotos { margin-top: -4px; font-size: 0.76rem; color: var(--sa-tinta-3); }
    .pista-fotos.activa { color: var(--sa-ambar-oscuro); font-weight: 600; }
    .pista-fotos .sa-enlace { margin-left: 4px; font-size: 0.76rem; }
    .agregar-foto { width: 68px; height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 1px dashed var(--sa-tinta-3); border-radius: 10px; background: var(--sa-papel); color: var(--sa-tinta-2); font-size: 0.68rem; font-weight: 600; cursor: pointer; }
    .agregar-foto:hover { border-color: var(--sa-tinta); color: var(--sa-tinta); }
    .agregar-foto .lucide { width: 18px; height: 18px; }
    .enlace-foto { display: flex; gap: 8px; }
    .enlace-foto .sa-campo { flex: 1; min-width: 0; }
    .archivo { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

    .editor > footer { display: flex; align-items: center; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--sa-linea-2); background: var(--sa-papel); }
    .editor > footer .eliminar { display: inline-flex; align-items: center; gap: 6px; padding: 8px 6px; border: 0; border-radius: 8px; background: none; color: var(--sa-rojo); font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .editor > footer .eliminar:hover { background: var(--sa-rojo-fondo); }
    .editor > footer .derecha { display: flex; gap: 10px; margin-left: auto; }

    @media (max-width: 900px) {
      .herramientas { width: 100%; }
      .herramientas .sa-buscador { flex: 1; }
      .catalogo { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
      .producto .info { padding: 12px; }
      .editor { width: 100%; border-left: 0; }
      .editor > header { padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
      .editor .cuerpo { padding: 18px 18px 24px; }
      .editor > footer { padding: 14px 18px calc(14px + env(safe-area-inset-bottom, 0px)); }
    }
    @media (max-width: 480px) {
      .dos { grid-template-columns: minmax(0, 1fr); }
      .variante-datos { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 34px; grid-template-areas: "nombre nombre quitar" "precio stock ."; }
      .variante-datos .v-nombre { grid-area: nombre; }
      .variante-datos .v-precio { grid-area: precio; }
      .variante-datos .v-stock { grid-area: stock; }
      .variante-datos .sa-icono-btn { grid-area: quitar; }
      .texto-eliminar { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .editor, .editor.abierto, .velo-editor { transition: none; }
    }
  </style>
</head>
<body>

<main class="sa-pagina">
  <header class="sa-encabezado">
    <div>
      <h1>Productos</h1>
      <p>Tocá un producto para editarlo.</p>
    </div>
    <div class="herramientas">
      <label class="sa-buscador"><i data-lucide="search"></i><input id="buscar" type="search" placeholder="Producto o color" aria-label="Buscar producto o color" autocomplete="off" /></label>
      <button type="button" class="sa-boton" id="btn-nuevo" aria-label="Nuevo producto"><i data-lucide="plus"></i><span>Nuevo<span class="sa-solo-ancho"> producto</span></span></button>
    </div>
  </header>

  <div class="sa-cifras">
    <div><small>Productos</small><b id="r-total">—</b></div>
    <div><small>Colores</small><b id="r-variantes">—</b></div>
    <div><small>Categorías</small><b id="r-cats">—</b></div>
  </div>

  <div class="sa-filtros" id="filtros" aria-label="Filtrar por categoría"></div>

  <div class="catalogo" id="catalogo"><div class="sa-vacio">Cargando productos…</div></div>
</main>

<div class="velo-editor" id="velo-editor"></div>
<aside class="editor" id="editor" role="dialog" aria-labelledby="editor-titulo">
  <header>
    <div>
      <h2 id="editor-titulo">Nuevo producto</h2>
      <a id="ver-en-tienda" href="#" target="_blank" rel="noopener" hidden><i data-lucide="external-link"></i>Ver en la tienda</a>
    </div>
    <button type="button" class="sa-icono-btn cerrar" data-cerrar-editor aria-label="Cerrar"><i data-lucide="x"></i></button>
  </header>

  <form class="cuerpo" id="form-producto" novalidate>
    <section>
      <h3>Datos</h3>
      <label class="campo"><span>Nombre</span><input class="sa-campo" id="prod-nombre" maxlength="120" placeholder="Ej: Go One More" /></label>
      <div class="dos">
        <label class="campo"><span>Categoría</span><input class="sa-campo" id="prod-categoria" list="lista-categorias" maxlength="80" placeholder="Ej: Gorros Visera" /></label>
        <label class="campo"><span>Subgrupo <i>(opcional)</i></span><input class="sa-campo" id="prod-subgrupo" maxlength="80" placeholder="Ej: Trail Running" /></label>
      </div>
      <datalist id="lista-categorias"></datalist>
      <label class="campo"><span>Descripción <i>(opcional)</i></span><textarea class="sa-campo" id="prod-descripcion" rows="3" placeholder="Cómo es, para qué sirve, qué lo hace especial"></textarea></label>
    </section>

    <section>
      <h3>En la tienda</h3>
      <div class="dos">
        <label class="campo"><span>Orden <i>(opcional)</i></span><input class="sa-campo" id="prod-orden" type="number" inputmode="numeric" min="1" placeholder="Ej: 1" /><small class="ayuda">El 1 aparece primero.</small></label>
        <label class="campo"><span>Descuento % <i>(opcional)</i></span><input class="sa-campo" id="prod-descuento" type="number" inputmode="numeric" min="1" max="90" placeholder="Ej: 20" /><small class="ayuda">Para todos los colores, de 1 a 90.</small></label>
      </div>
      <div>
        <label class="opcion"><span>Mostrar en “Lo nuevo”<small>Aparece destacado en el inicio de la tienda.</small></span><button type="button" class="sa-interruptor" role="switch" aria-checked="false" id="prod-nuevo" aria-label="Mostrar en Lo nuevo"></button></label>
        <label class="opcion"><span>Mostrar en “Lo más vendido”<small>Aparece en la sección de más vendidos.</small></span><button type="button" class="sa-interruptor" role="switch" aria-checked="false" id="prod-mas-vendido" aria-label="Mostrar en Lo más vendido"></button></label>
      </div>
    </section>

    <section>
      <h3>Foto de ambiente <span style="font-weight:400">(opcional)</span></h3>
      <div class="ambiente">
        <span id="ambiente-vista"></span>
        <div>
          <small class="ayuda" style="margin:0">Aparece desenfocada de fondo en la página del producto.</small>
          <span style="display:flex;gap:8px;flex-wrap:wrap">
            <label class="sa-boton-sec boton-chico" for="ambiente-archivo"><i data-lucide="upload"></i>Subir foto</label>
            <button type="button" class="sa-boton-sec boton-chico" id="ambiente-quitar" hidden>Quitar</button>
          </span>
          <input class="archivo" type="file" id="ambiente-archivo" accept="image/*" />
        </div>
      </div>
      <label class="campo"><span>O pegá el enlace de una foto</span><input class="sa-campo" id="ambiente-enlace" type="url" placeholder="https://…" /></label>
    </section>

    <section>
      <div class="titulo-seccion">
        <h3>Colores</h3>
        <button type="button" class="sa-boton-sec boton-chico" id="btn-agregar-color"><i data-lucide="plus"></i>Agregar color</button>
      </div>
      <div id="variantes" style="display:flex;flex-direction:column;gap:12px"></div>
    </section>
  </form>

  <footer>
    <button type="button" class="eliminar" id="btn-eliminar" aria-label="Eliminar producto"><i data-lucide="trash-2"></i><span class="texto-eliminar">Eliminar</span></button>
    <div class="derecha">
      <button type="button" class="sa-boton-sec" data-cerrar-editor>Cancelar</button>
      <button type="button" class="sa-boton" id="btn-guardar"><i data-lucide="check"></i>Guardar</button>
    </div>
  </footer>
</aside>

<script>
  const $ = id => document.getElementById(id);
  const pesos = n => '$' + num(n).toLocaleString('es-UY');
  const normal = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

  const estado = { productos: [], cargado: false };
  let filtro = 'todos';
  let borrador = null;   // producto que se está editando: { id, fotoAvatar, variantes: [{ clave, nombre, precio, stock, fotos }] }
  let sucio = false;     // hay cambios sin guardar
  let siguienteClave = 0;
  let fotoElegida = null;  // foto tocada para cambiarla de lugar: { clave del color, posición }
  let arrastre = null;     // foto que se está arrastrando (en la compu)
  const arrastrable = matchMedia('(pointer: fine)').matches;

  const variantesDe = p => (Array.isArray(p.variantes) ? p.variantes : Object.values(p.variantes || {})).filter(v => v && typeof v === 'object');
  const descuentoDe = p => Math.min(90, Math.max(0, parseInt(p.descuento, 10) || 0));
  const fotosDe = v => (Array.isArray(v.fotos) && v.fotos.length ? v.fotos : (v.foto ? [v.foto] : [])).filter(f => typeof f === 'string' && f);
  function imagen(foto, extra = '') {
    const f = fotoLiviana(foto);
    return f ? `<img src="${esc(f)}" alt=""${extra}${/^(blob|data):/.test(f) ? '' : ' loading="lazy"'} />` : '';
  }

  // ── Catálogo ──────────────────────────────────
  function precioTexto(p) {
    const precios = variantesDe(p).map(v => num(v.precio)).filter(n => n > 0);
    if (!precios.length) return 'Sin precio';
    const min = Math.min(...precios), max = Math.max(...precios);
    const rango = (a, b) => a === b ? pesos(a) : `${pesos(a)} – ${pesos(b)}`;
    const dto = descuentoDe(p);
    // Mismo cálculo que la tienda (precioFinal en cart.js)
    const con = n => Math.round(n * (100 - dto) / 100);
    return dto ? `<s>${rango(min, max)}</s>${rango(con(min), con(max))}` : rango(min, max);
  }

  function tarjeta(p) {
    const vars = variantesDe(p);
    const principal = vars.map(v => fotoVariante(v)).find(Boolean);
    const dto = descuentoDe(p);
    const etiquetas = [
      p.nuevo ? '<span class="etiqueta">Nuevo</span>' : '',
      p.masVendido ? '<span class="etiqueta">Más vendido</span>' : '',
      dto ? `<span class="etiqueta oferta">−${dto}%</span>` : ''
    ].join('');
    const muestras = vars.slice(0, 6).map(v => imagen(fotoVariante(v)) || '<span class="punto"></span>').join('');
    return `
      <button type="button" class="producto" data-id="${esc(p.id)}">
        <span class="foto">${imagen(principal) || '<span class="sin-foto"><i data-lucide="image"></i></span>'}${etiquetas ? `<span class="etiquetas">${etiquetas}</span>` : ''}</span>
        <span class="info">
          <small>${esc([p.categoria, p.subgrupo].filter(Boolean).join(', ') || 'Sin categoría')}</small>
          <b>${esc(p.nombre || 'Sin nombre')}</b>
          <span class="muestras">${muestras}<em>${vars.length === 1 ? '1 color' : `${vars.length} colores`}</em></span>
          <span class="precio">${precioTexto(p)}</span>
        </span>
      </button>`;
  }

  function dibujarCatalogo() {
    if (!estado.cargado) return;
    const prods = estado.productos;
    const cats = [...new Set(prods.map(p => p.categoria).filter(Boolean))];
    $('r-total').textContent = prods.length;
    $('r-variantes').textContent = prods.reduce((s, p) => s + variantesDe(p).length, 0);
    $('r-cats').textContent = cats.length;
    if (filtro !== 'todos' && !cats.includes(filtro)) filtro = 'todos';
    $('filtros').innerHTML = [['todos', 'Todos', prods.length], ...cats.map(c => [c, c, prods.filter(p => p.categoria === c).length])]
      .map(([f, t, n]) => `<button type="button" data-filtro="${esc(f)}" aria-pressed="${f === filtro}">${esc(t)} <em>${n}</em></button>`).join('');
    $('lista-categorias').innerHTML = cats.map(c => `<option value="${esc(c)}"></option>`).join('');

    const q = normal($('buscar').value.trim());
    const visibles = prods.filter(p => (filtro === 'todos' || p.categoria === filtro) &&
      (!q || normal([p.nombre, p.categoria, p.subgrupo, ...variantesDe(p).map(v => v.nombre)].join(' ')).includes(q)));
    $('catalogo').innerHTML = visibles.length
      ? visibles.map(tarjeta).join('')
      : `<div class="sa-vacio">${prods.length
          ? 'Ningún producto coincide con la búsqueda.'
          : '<i data-lucide="package"></i>Todavía no hay productos.<br><button type="button" class="sa-boton" data-nuevo><i data-lucide="plus"></i>Agregar el primero</button>'}</div>`;
    panel.iconos();
  }

  // ── Editor ─────────────────────────────────────
  function pintarAmbiente() {
    const f = borrador.fotoAvatar;
    $('ambiente-vista').innerHTML = f ? `<img src="${esc(f)}" alt="Foto de ambiente" />` : '<span class="vacia"><i data-lucide="image"></i></span>';
    $('ambiente-quitar').hidden = !f;
    $('ambiente-enlace').value = f && !f.startsWith('data:') ? f : '';
    panel.iconos();
  }

  function htmlFotos(v) {
    const elegida = fotoElegida && fotoElegida.clave === v.clave ? fotoElegida.indice : -1;
    return v.fotos.map((f, i) => `
      <span class="foto-celda${i === elegida ? ' elegida' : ''}" data-indice="${i}"${arrastrable && v.fotos.length > 1 ? ' draggable="true"' : ''}>
        <span class="foto-tile" role="button" tabindex="0" data-elegir-foto="${i}" aria-pressed="${i === elegida}" aria-label="Foto ${i + 1}${i === 0 ? ', la principal' : ''}">${imagen(f)}</span>
        ${i === 0 && v.fotos.length > 1 ? '<span class="principal">Principal</span>' : ''}
        <button type="button" class="quitar" data-quitar-foto="${i}" aria-label="Quitar la foto ${i + 1}"><i data-lucide="x"></i></button>
      </span>`).join('') + `
      <label class="agregar-foto"><i data-lucide="image-plus"></i>Agregar
        <input class="archivo" type="file" accept="image/*" multiple data-subir-foto />
      </label>`;
  }

  // Ayuda para ordenar: tocar una foto y después otra las cambia de lugar
  function htmlPista(v) {
    if (v.fotos.length < 2) return '';
    if (fotoElegida && fotoElegida.clave === v.clave) {
      return '<p class="pista-fotos activa">Ahora tocá la foto con la que la querés cambiar.<button type="button" class="sa-enlace" data-cancelar-eleccion>Cancelar</button></p>';
    }
    return `<p class="pista-fotos">Para ordenarlas, tocá una foto y después otra${arrastrable ? ', o arrastralas' : ''}. La primera es la principal.</p>`;
  }

  function htmlVariante(v, i) {
    return `
      <div class="variante" data-clave="${v.clave}">
        <div class="variante-datos">
          <label class="campo v-nombre"><span>Color o modelo</span><input class="sa-campo" data-campo="nombre" maxlength="80" value="${esc(v.nombre)}" placeholder="Ej: Blanco, Azul, Talle M" /></label>
          <label class="campo v-precio"><span>Precio</span><input class="sa-campo" data-campo="precio" type="number" inputmode="numeric" min="0" value="${esc(v.precio)}" placeholder="790" /></label>
          <label class="campo v-stock"><span>Stock</span><input class="sa-campo" data-campo="stock" type="number" inputmode="numeric" min="0" value="${esc(v.stock)}" placeholder="0" /></label>
          <button type="button" class="sa-icono-btn" data-quitar-variante aria-label="Quitar el color ${esc(v.nombre || i + 1)}"><i data-lucide="trash-2"></i></button>
        </div>
        <div class="fotos" data-fotos>${htmlFotos(v)}</div>
        <div data-pista>${htmlPista(v)}</div>
        <div>
          <button type="button" class="sa-enlace" data-mostrar-enlace>O pegá el enlace de una foto</button>
          <div class="enlace-foto" data-enlace hidden>
            <input class="sa-campo" type="url" placeholder="https://…" aria-label="Enlace de la foto" />
            <button type="button" class="sa-boton-sec boton-chico" data-agregar-enlace>Agregar</button>
          </div>
        </div>
      </div>`;
  }

  function pintarVariantes() {
    $('variantes').innerHTML = borrador.variantes.map(htmlVariante).join('');
    panel.iconos();
  }

  const varianteDe = el => {
    const caja = el.closest('[data-clave]');
    return caja ? { caja, v: borrador.variantes.find(x => x.clave === Number(caja.dataset.clave)) } : {};
  };
  function pintarFotos(caja, v) {
    caja.querySelector('[data-fotos]').innerHTML = htmlFotos(v);
    caja.querySelector('[data-pista]').innerHTML = htmlPista(v);
    panel.iconos();
  }

  function pintarFotosDe(clave) {
    const caja = $('variantes').querySelector(`[data-clave="${clave}"]`);
    const v = borrador && borrador.variantes.find(x => x.clave === clave);
    if (caja && v) pintarFotos(caja, v);
  }

  // Primer toque: elige la foto. Segundo toque en otra del mismo color: se cambian de lugar.
  function elegirFoto(caja, v, i) {
    const anterior = fotoElegida;
    if (anterior && anterior.clave === v.clave) {
      fotoElegida = null;
      if (anterior.indice !== i) {
        [v.fotos[i], v.fotos[anterior.indice]] = [v.fotos[anterior.indice], v.fotos[i]];
        sucio = true;
      }
    } else {
      fotoElegida = { clave: v.clave, indice: i };
      if (anterior) pintarFotosDe(anterior.clave);
    }
    pintarFotos(caja, v);
    const tile = caja.querySelector(`[data-elegir-foto="${i}"]`);
    if (tile) tile.focus({ preventScroll: true });
  }

  async function abrirEditor(p) {
    fotoElegida = null;
    const vars = p ? variantesDe(p) : [];
    let stock = {};
    if (p && vars.length) {
      try { stock = (await db.ref('stock').once('value')).val() || {}; } catch (e) { stock = {}; }
    }
    borrador = {
      id: p ? p.id : null,
      fotoAvatar: p && typeof p.fotoAvatar === 'string' ? p.fotoAvatar : '',
      variantes: (vars.length ? vars : [{}]).map((v, i) => ({
        clave: siguienteClave++,
        nombre: v.nombre || '',
        precio: v.precio ?? '',
        // El stock se lee del mismo lugar que usa la tienda
        stock: p && vars.length ? Math.max(0, num(stock[v.stockId || p.id + '-' + i])) : '',
        fotos: fotosDe(v)
      }))
    };
    $('editor-titulo').textContent = p ? (p.nombre || 'Sin nombre') : 'Nuevo producto';
    $('ver-en-tienda').hidden = !p;
    if (p) $('ver-en-tienda').href = '/producto.html?id=' + encodeURIComponent(p.id);
    $('btn-eliminar').hidden = !p;
    $('prod-nombre').value = p?.nombre || '';
    $('prod-categoria').value = p?.categoria || (filtro !== 'todos' ? filtro : '');
    $('prod-subgrupo').value = p?.subgrupo || '';
    $('prod-descripcion').value = p?.descripcion || '';
    $('prod-orden').value = p?.orden ?? '';
    $('prod-descuento').value = p?.descuento || '';
    $('prod-nuevo').setAttribute('aria-checked', String(!!p?.nuevo));
    $('prod-mas-vendido').setAttribute('aria-checked', String(!!p?.masVendido));
    $('ambiente-archivo').value = '';
    pintarAmbiente();
    pintarVariantes();
    $('form-producto').scrollTop = 0;
    sucio = false;
    $('editor').classList.add('abierto');
    $('velo-editor').classList.add('visible');
    (p ? $('editor').querySelector('[data-cerrar-editor]') : $('prod-nombre')).focus({ preventScroll: true });
  }

  async function cerrarEditor(forzar) {
    if (!borrador) return;
    if (sucio && !forzar) {
      const salir = await panel.confirmar({ titulo: '¿Salir sin guardar?', texto: 'Los cambios de este producto se pierden.', boton: 'Salir sin guardar', peligro: true });
      if (!salir) return;
    }
    const id = borrador.id;
    borrador = null;
    sucio = false;
    $('editor').classList.remove('abierto');
    $('velo-editor').classList.remove('visible');
    const t = [...document.querySelectorAll('.producto')].find(x => x.dataset.id === id);
    if (t) t.focus({ preventScroll: true });
  }

  // Achica la foto antes de guardarla (en la base se guarda como texto base64)
  function achicarFoto(archivo, maximo, calidad) {
    return new Promise((resolver, rechazar) => {
      const lector = new FileReader();
      lector.onload = e => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > maximo || h > maximo) {
            if (w > h) { h = Math.round(h * maximo / w); w = maximo; }
            else { w = Math.round(w * maximo / h); h = maximo; }
          }
          const lienzo = document.createElement('canvas');
          lienzo.width = w; lienzo.height = h;
          lienzo.getContext('2d').drawImage(img, 0, 0, w, h);
          resolver(lienzo.toDataURL('image/jpeg', calidad));
        };
        img.onerror = () => rechazar(new Error('No se pudo leer la foto'));
        img.src = e.target.result;
      };
      lector.onerror = () => rechazar(new Error('No se pudo leer la foto'));
      lector.readAsDataURL(archivo);
    });
  }

  const enlaceValido = u => /^(https:\/\/|\/)[^\s"'<>]+$/i.test(u) || /^[\w-][\w\-./]*\.(jpe?g|png|webp|gif|avif)$/i.test(u);

  async function guardar() {
    const nombre = $('prod-nombre').value.trim();
    const categoria = $('prod-categoria').value.trim();
    const subgrupo = $('prod-subgrupo').value.trim();
    const descripcion = $('prod-descripcion').value.trim();
    const ordenTexto = $('prod-orden').value.trim();
    const orden = ordenTexto ? parseInt(ordenTexto, 10) : null;
    const descuentoTexto = $('prod-descuento').value.trim();
    const descuento = descuentoTexto ? parseInt(descuentoTexto, 10) : 0;
    const error = (texto, campo) => { panel.aviso(texto, true); if (campo) campo.focus(); };

    if (!nombre) return error('Escribí el nombre del producto.', $('prod-nombre'));
    if (!categoria) return error('Elegí o escribí una categoría.', $('prod-categoria'));
    if (ordenTexto && !(orden >= 1)) return error('El orden tiene que ser un número desde 1.', $('prod-orden'));
    if (descuentoTexto && !(descuento >= 1 && descuento <= 90)) return error('El descuento tiene que ser entre 1 y 90%.', $('prod-descuento'));

    const variantes = borrador.variantes
      .filter(v => String(v.nombre).trim())
      .map(v => {
        const fotos = v.fotos.slice();
        return {
          nombre: String(v.nombre).trim(),
          precio: Math.max(0, parseInt(v.precio, 10) || 0),
          foto: fotos[0] || '',
          fotos,
          stockInicial: Math.max(0, parseInt(v.stock, 10) || 0)
        };
      });
    if (!variantes.length) return error('Agregá al menos un color con nombre.');

    const prod = { nombre, categoria, subgrupo, descripcion, variantes, actualizado: new Date().toISOString() };
    if (orden !== null) prod.orden = orden;
    if (descuento) prod.descuento = descuento;
    if ($('prod-nuevo').getAttribute('aria-checked') === 'true') prod.nuevo = true;
    if ($('prod-mas-vendido').getAttribute('aria-checked') === 'true') prod.masVendido = true;
    if (borrador.fotoAvatar) prod.fotoAvatar = borrador.fotoAvatar;

    const btn = $('btn-guardar');
    btn.disabled = true;
    btn.lastChild.textContent = 'Guardando…';
    try {
      const ref = borrador.id ? db.ref('productos/' + borrador.id) : db.ref('productos').push();
      await ref.set(prod);
      const prodId = borrador.id || ref.key;
      // El stock de cada color queda con lo que dice el formulario (nuevo o editado)
      await Promise.all(variantes.map((v, i) => db.ref('stock/' + prodId + '-' + i).set(v.stockInicial)));
      cerrarEditor(true);
      panel.aviso(`${nombre} guardado`);
    } catch (e) {
      panel.aviso('No se pudo guardar el producto. Revisá la conexión y probá de nuevo.', true);
    } finally {
      btn.disabled = false;
      btn.lastChild.textContent = 'Guardar';
    }
  }

  async function eliminar() {
    const p = estado.productos.find(x => x.id === borrador?.id);
    if (!p) return;
    const si = await panel.confirmar({
      titulo: `¿Eliminar ${p.nombre || 'este producto'}?`,
      texto: 'Deja de aparecer en la tienda y no se puede recuperar.',
      boton: 'Eliminar producto',
      peligro: true
    });
    if (!si) return;
    try {
      await db.ref('productos/' + p.id).remove();
      cerrarEditor(true);
      panel.aviso(`${p.nombre || 'Producto'} eliminado`);
    } catch (e) {
      panel.aviso('No se pudo eliminar el producto. Probá de nuevo.', true);
    }
  }

  // ── Eventos ────────────────────────────────────
  $('btn-nuevo').addEventListener('click', () => abrirEditor(null));
  $('catalogo').addEventListener('click', e => {
    if (e.target.closest('[data-nuevo]')) return abrirEditor(null);
    const t = e.target.closest('.producto');
    if (t) abrirEditor(estado.productos.find(p => p.id === t.dataset.id));
  });
  $('filtros').addEventListener('click', e => {
    const b = e.target.closest('[data-filtro]');
    if (!b) return;
    filtro = b.dataset.filtro;
    dibujarCatalogo();
  });
  $('buscar').addEventListener('input', dibujarCatalogo);

  $('editor').addEventListener('click', e => {
    if (e.target.closest('[data-cerrar-editor]')) return cerrarEditor();
  });
  $('velo-editor').addEventListener('click', () => cerrarEditor());
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape' || !borrador || document.querySelector('dialog[open]')) return;
    if (fotoElegida) {
      const clave = fotoElegida.clave;
      fotoElegida = null;
      return pintarFotosDe(clave);
    }
    cerrarEditor();
  });
  $('form-producto').addEventListener('submit', e => e.preventDefault());
  $('form-producto').addEventListener('input', () => { sucio = true; });
  $('btn-guardar').addEventListener('click', guardar);
  $('btn-eliminar').addEventListener('click', eliminar);

  ['prod-nuevo', 'prod-mas-vendido'].forEach(id => $(id).addEventListener('click', e => {
    e.preventDefault();
    const b = $(id);
    b.setAttribute('aria-checked', String(b.getAttribute('aria-checked') !== 'true'));
    sucio = true;
  }));

  // Foto de ambiente
  $('ambiente-archivo').addEventListener('change', async e => {
    const archivo = e.target.files[0];
    if (!archivo) return;
    try {
      borrador.fotoAvatar = await achicarFoto(archivo, 1200, 0.82);
      sucio = true;
      pintarAmbiente();
    } catch (err) {
      panel.aviso('No se pudo leer esa foto. Probá con otra.', true);
    }
    e.target.value = '';
  });
  $('ambiente-enlace').addEventListener('change', e => {
    const u = e.target.value.trim();
    if (u && !enlaceValido(u)) { panel.aviso('Ese enlace no parece de una foto. Tiene que empezar con https://', true); return; }
    borrador.fotoAvatar = u;
    sucio = true;
    pintarAmbiente();
  });
  $('ambiente-quitar').addEventListener('click', () => {
    borrador.fotoAvatar = '';
    sucio = true;
    pintarAmbiente();
  });

  // Colores
  $('btn-agregar-color').addEventListener('click', () => {
    borrador.variantes.push({ clave: siguienteClave++, nombre: '', precio: borrador.variantes[borrador.variantes.length - 1]?.precio ?? '', stock: '', fotos: [] });
    sucio = true;
    pintarVariantes();
    const cajas = $('variantes').querySelectorAll('.variante');
    const ultima = cajas[cajas.length - 1];
    ultima.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    ultima.querySelector('[data-campo="nombre"]').focus({ preventScroll: true });
  });
  $('variantes').addEventListener('input', e => {
    const campo = e.target.dataset.campo;
    if (!campo) return;
    const { v } = varianteDe(e.target);
    if (v) v[campo] = e.target.value;
  });
  $('variantes').addEventListener('click', e => {
    const { caja, v } = varianteDe(e.target);
    if (!v) return;
    if (e.target.closest('[data-quitar-variante]')) {
      if (fotoElegida && fotoElegida.clave === v.clave) fotoElegida = null;
      borrador.variantes = borrador.variantes.filter(x => x !== v);
      sucio = true;
      return pintarVariantes();
    }
    const quitar = e.target.closest('[data-quitar-foto]');
    if (quitar) {
      if (fotoElegida && fotoElegida.clave === v.clave) fotoElegida = null;
      v.fotos.splice(Number(quitar.dataset.quitarFoto), 1);
      sucio = true;
      return pintarFotos(caja, v);
    }
    if (e.target.closest('[data-cancelar-eleccion]')) {
      fotoElegida = null;
      return pintarFotos(caja, v);
    }
    const tile = e.target.closest('[data-elegir-foto]');
    if (tile) return elegirFoto(caja, v, Number(tile.dataset.elegirFoto));
    if (e.target.closest('[data-mostrar-enlace]')) {
      e.target.closest('[data-mostrar-enlace]').hidden = true;
      const enlace = caja.querySelector('[data-enlace]');
      enlace.hidden = false;
      return enlace.querySelector('input').focus();
    }
    if (e.target.closest('[data-agregar-enlace]')) {
      const input = caja.querySelector('[data-enlace] input');
      const u = input.value.trim();
      if (!u) return input.focus();
      if (!enlaceValido(u)) return panel.aviso('Ese enlace no parece de una foto. Tiene que empezar con https://', true);
      v.fotos.push(u);
      input.value = '';
      sucio = true;
      pintarFotos(caja, v);
    }
  });
  $('variantes').addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-elegir-foto]')) {
      e.preventDefault();
      return e.target.click();
    }
    if (e.key === 'Enter' && e.target.closest('[data-enlace]')) {
      e.preventDefault();
      e.target.closest('[data-enlace]').querySelector('[data-agregar-enlace]').click();
    }
  });
  $('variantes').addEventListener('change', async e => {
    if (!e.target.matches('[data-subir-foto]')) return;
    const { caja, v } = varianteDe(e.target);
    const archivos = [...e.target.files];
    if (!v || !archivos.length) return;
    for (const archivo of archivos) {
      try {
        v.fotos.push(await achicarFoto(archivo, 800, 0.75));
        sucio = true;
      } catch (err) {
        panel.aviso('No se pudo leer esa foto. Probá con otra.', true);
      }
    }
    pintarFotos(caja, v);
  });

  // En la compu también se pueden arrastrar: la foto queda en el lugar donde se suelta
  $('variantes').addEventListener('dragstart', e => {
    const celda = e.target.closest('.foto-celda');
    const { v } = celda ? varianteDe(celda) : {};
    if (!v) return;
    arrastre = { clave: v.clave, indice: Number(celda.dataset.indice) };
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', '');
    celda.classList.add('arrastrando');
  });
  $('variantes').addEventListener('dragover', e => {
    const celda = e.target.closest('.foto-celda');
    const { v } = celda ? varianteDe(celda) : {};
    if (!arrastre || !v || v.clave !== arrastre.clave) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    $('variantes').querySelectorAll('.foto-celda.encima').forEach(x => { if (x !== celda) x.classList.remove('encima'); });
    celda.classList.add('encima');
  });
  $('variantes').addEventListener('drop', e => {
    const celda = e.target.closest('.foto-celda');
    const { caja, v } = celda ? varianteDe(celda) : {};
    if (!arrastre || !v || v.clave !== arrastre.clave) return;
    e.preventDefault();
    const desde = arrastre.indice, hasta = Number(celda.dataset.indice);
    arrastre = null;
    if (desde !== hasta) {
      const [foto] = v.fotos.splice(desde, 1);
      v.fotos.splice(hasta, 0, foto);
      sucio = true;
    }
    fotoElegida = null;
    pintarFotos(caja, v);
  });
  $('variantes').addEventListener('dragend', () => {
    arrastre = null;
    $('variantes').querySelectorAll('.arrastrando, .encima').forEach(x => x.classList.remove('arrastrando', 'encima'));
  });

  // ── Datos en vivo ──────────────────────────────
  db.ref('productos').on('value', snap => {
    const lista = [];
    snap.forEach(c => { const v = c.val(); if (v && typeof v === 'object') lista.push({ ...v, id: c.key }); });
    // Mismo orden que la tienda: por "orden" y después por nombre
    lista.sort((a, b) => (num(a.orden) || 999) - (num(b.orden) || 999) || String(a.nombre || '').localeCompare(String(b.nombre || '')));
    estado.productos = lista;
    estado.cargado = true;
    dibujarCatalogo();
  });
</script>
</body>
</html>
