<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" href="../img/logo.png" />
  <link rel="icon" type="image/png" href="../img/logo.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sendera Admin" />
  <meta name="theme-color" content="#182417" />
  <title>Sendera - Lookbook</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="../firebase-config.js"></script>
  <script src="admin-auth.js?v=2"></script>
  <link rel="stylesheet" href="admin.css?v=1" />
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="admin-ui.js?v=1"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { min-height: 100vh; font-size: 14px; line-height: 1.5; }
    button, input { font-family: inherit; }

    /* Agregar una foto */
    .agregar { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; align-items: start; margin-bottom: 30px; }
    .elegir {
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      aspect-ratio: 4 / 5; border: 1.5px dashed var(--sa-tinta-3); border-radius: 14px; background: var(--sa-papel-2);
      color: var(--sa-tinta-2); font-size: 0.82rem; font-weight: 600; text-align: center; cursor: pointer; overflow: hidden;
    }
    .elegir:hover, .elegir.encima { border-color: var(--sa-tinta); color: var(--sa-tinta); }
    .elegir .lucide { width: 26px; height: 26px; }
    .elegir small { font-weight: 400; color: var(--sa-tinta-3); font-size: 0.74rem; padding: 0 14px; }
    .elegir img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .elegir.con-foto { border-style: solid; border-color: var(--sa-linea); }
    .archivo { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .agregar-campos { display: flex; flex-direction: column; gap: 14px; }
    .agregar-campos h2 { font-size: 0.98rem; font-weight: 600; }
    .campo > span { display: block; margin-bottom: 6px; font-size: 0.8rem; font-weight: 500; color: var(--sa-tinta-2); }
    .campo > span i { font-style: normal; font-weight: 400; color: var(--sa-tinta-3); }
    .agregar-acciones { display: flex; gap: 10px; flex-wrap: wrap; }

    /* Fotos publicadas */
    .titulo-fotos { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
    .titulo-fotos h2 { font: 600 1.45rem/1.2 var(--sa-serif); }
    .titulo-fotos small { color: var(--sa-tinta-3); font-size: 0.82rem; }
    .fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .fotos > .sa-vacio { grid-column: 1 / -1; background: var(--sa-papel); border: 1px solid var(--sa-linea); border-radius: 16px; }
    .foto { position: relative; background: var(--sa-papel); border: 1px solid var(--sa-linea); border-radius: 14px; overflow: hidden; }
    .foto img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: var(--sa-papel-2); }
    .foto p { padding: 10px 12px; font-size: 0.8rem; color: var(--sa-tinta-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .foto p.sin-texto { color: var(--sa-tinta-3); }
    .foto .borrar { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; display: grid; place-items: center; border: 0; border-radius: 10px; background: rgba(255, 253, 248, 0.92); color: var(--sa-rojo); cursor: pointer; }
    .foto .borrar:hover { background: var(--sa-rojo-fondo); }
    .foto .borrar .lucide { width: 17px; height: 17px; }

    @media (max-width: 900px) {
      .agregar { grid-template-columns: minmax(0, 1fr); gap: 16px; }
      .elegir { aspect-ratio: 16 / 9; }
      .agregar-acciones .sa-boton { flex: 1; }
      .fotos { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    }
  </style>
</head>
<body>

<main class="sa-pagina">
  <header class="sa-encabezado">
    <div>
      <h1>Lookbook</h1>
      <p>Las fotos de la galería de la tienda. La más nueva aparece primero.</p>
    </div>
  </header>

  <section class="sa-panel agregar" aria-labelledby="titulo-agregar">
    <label class="elegir" id="elegir">
      <span id="elegir-texto" style="display:contents"><i data-lucide="image-plus"></i>Elegir foto<small>o arrastrala acá</small></span>
      <input class="archivo" type="file" id="lb-archivo" accept="image/*" />
    </label>
    <div class="agregar-campos">
      <h2 id="titulo-agregar">Agregar una foto</h2>
      <label class="campo"><span>O pegá el enlace de una foto</span><input class="sa-campo" id="lb-enlace" type="url" placeholder="https://…" /></label>
      <label class="campo"><span>Descripción <i>(opcional)</i></span><input class="sa-campo" id="lb-texto" maxlength="140" placeholder="Ej: Gorro Sendera en el cerro" /></label>
      <div class="agregar-acciones">
        <button type="button" class="sa-boton" id="btn-agregar" disabled><i data-lucide="plus"></i>Agregar al lookbook</button>
        <button type="button" class="sa-boton-sec" id="btn-limpiar" hidden>Elegir otra</button>
      </div>
    </div>
  </section>

  <div class="titulo-fotos"><h2>Fotos publicadas</h2><small id="cuantas"></small></div>
  <div class="fotos" id="fotos"><div class="sa-vacio">Cargando…</div></div>
</main>

<script>
  const $ = id => document.getElementById(id);
  let foto = '';          // la foto elegida, en base64 o como enlace
  let fotos = [];

  function mostrarElegida() {
    const caja = $('elegir');
    caja.classList.toggle('con-foto', !!foto);
    caja.querySelector('img')?.remove();
    if (foto) {
      const img = document.createElement('img');
      img.alt = 'Foto elegida';
      img.src = foto;
      caja.prepend(img);
    }
    $('elegir-texto').hidden = !!foto;
    $('btn-agregar').disabled = !foto;
    $('btn-limpiar').hidden = !foto;
  }

  function limpiar() {
    foto = '';
    $('lb-enlace').value = '';
    $('lb-texto').value = '';
    $('lb-archivo').value = '';
    mostrarElegida();
  }

  // Se achica antes de guardar (en la base se guarda como texto base64)
  function achicarFoto(archivo) {
    return new Promise((resolver, rechazar) => {
      const lector = new FileReader();
      lector.onload = e => {
        const img = new Image();
        img.onload = () => {
          const MAX = 1000;
          let w = img.width, h = img.height;
          if (w > MAX || h > MAX) {
            if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
            else { w = Math.round(w * MAX / h); h = MAX; }
          }
          const lienzo = document.createElement('canvas');
          lienzo.width = w; lienzo.height = h;
          lienzo.getContext('2d').drawImage(img, 0, 0, w, h);
          resolver(lienzo.toDataURL('image/jpeg', 0.8));
        };
        img.onerror = () => rechazar(new Error('foto'));
        img.src = e.target.result;
      };
      lector.onerror = () => rechazar(new Error('foto'));
      lector.readAsDataURL(archivo);
    });
  }

  async function usarArchivo(archivo) {
    if (!archivo || !archivo.type.startsWith('image/')) { panel.aviso('Elegí un archivo de foto.', true); return; }
    try {
      foto = await achicarFoto(archivo);
      $('lb-enlace').value = '';
      mostrarElegida();
    } catch (e) {
      panel.aviso('No se pudo leer esa foto. Probá con otra.', true);
    }
  }

  function dibujar() {
    $('cuantas').textContent = fotos.length === 1 ? '1 foto' : `${fotos.length} fotos`;
    $('fotos').innerHTML = fotos.length
      ? fotos.map(f => {
          const src = typeof f.foto === 'string' ? fotoLiviana(f.foto) : '';
          return `
          <figure class="foto">
            ${src ? `<img src="${esc(src)}" alt="${esc(f.caption || 'Foto del lookbook')}"${/^(blob|data):/.test(src) ? '' : ' loading="lazy"'} />` : '<img alt="" />'}
            <p class="${f.caption ? '' : 'sin-texto'}">${esc(f.caption || 'Sin descripción')}</p>
            <button type="button" class="borrar" data-borrar="${esc(f.id)}" aria-label="Borrar esta foto del lookbook"><i data-lucide="trash-2"></i></button>
          </figure>`;
        }).join('')
      : '<div class="sa-vacio"><i data-lucide="image"></i>Todavía no hay fotos. Agregá la primera desde arriba.</div>';
    panel.iconos();
  }

  // ── Eventos ────────────────────────────────────
  $('lb-archivo').addEventListener('change', e => usarArchivo(e.target.files[0]));
  ['dragenter', 'dragover'].forEach(t => $('elegir').addEventListener(t, e => { e.preventDefault(); $('elegir').classList.add('encima'); }));
  ['dragleave', 'drop'].forEach(t => $('elegir').addEventListener(t, () => $('elegir').classList.remove('encima')));
  $('elegir').addEventListener('drop', e => { e.preventDefault(); usarArchivo(e.dataTransfer.files[0]); });

  $('lb-enlace').addEventListener('input', () => {
    const u = $('lb-enlace').value.trim();
    foto = /^https:\/\/[^\s"'<>]+$/i.test(u) ? u : '';
    mostrarElegida();
  });
  $('btn-limpiar').addEventListener('click', limpiar);

  $('btn-agregar').addEventListener('click', async () => {
    if (!foto) { panel.aviso('Elegí una foto primero.', true); return; }
    const btn = $('btn-agregar');
    btn.disabled = true;
    try {
      await db.ref('lookbook').push({ foto, caption: $('lb-texto').value.trim(), fecha: new Date().toISOString() });
      limpiar();
      panel.aviso('Foto agregada al lookbook');
    } catch (e) {
      panel.aviso('No se pudo agregar la foto. Probá de nuevo.', true);
      btn.disabled = false;
    }
  });

  $('fotos').addEventListener('click', async e => {
    const b = e.target.closest('[data-borrar]');
    if (!b) return;
    const si = await panel.confirmar({ titulo: '¿Borrar esta foto del lookbook?', texto: 'Deja de verse en la tienda y no se puede recuperar.', boton: 'Borrar foto', peligro: true });
    if (!si) return;
    try {
      await db.ref('lookbook/' + b.dataset.borrar).remove();
      panel.aviso('Foto borrada');
    } catch (err) {
      panel.aviso('No se pudo borrar la foto. Probá de nuevo.', true);
    }
  });

  // ── Datos en vivo ──────────────────────────────
  db.ref('lookbook').on('value', snap => {
    const lista = [];
    snap.forEach(c => { const v = c.val(); if (v && typeof v === 'object') lista.push({ ...v, id: c.key }); });
    fotos = lista.reverse();
    dibujar();
  });
</script>
</body>
</html>
