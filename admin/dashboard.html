<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" href="../img/logo.png" />
  <link rel="icon" type="image/png" href="../img/logo.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sendera Admin" />
  <meta name="theme-color" content="#182417" />
  <title>Sendera - Inicio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="../firebase-config.js"></script>
  <script src="admin-auth.js?v=2"></script>
  <link rel="stylesheet" href="admin.css?v=1" />
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="admin-ui.js?v=1"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; font-size: 14px; line-height: 1.5; }

    .en-vivo { display: inline-flex; align-items: center; gap: 7px; font-size: 0.78rem; color: var(--sa-tinta-2); white-space: nowrap; }
    .en-vivo i { width: 8px; height: 8px; border-radius: 50%; background: var(--sa-verde); box-shadow: 0 0 0 4px var(--sa-verde-fondo); }

    /* Caja y sierra de ventas */
    .caja-cifras { display: flex; align-items: flex-end; gap: 40px; flex-wrap: wrap; }
    .caja-hoy small { display: block; color: var(--sa-tinta-2); font-weight: 500; margin-bottom: 6px; }
    .caja-hoy strong { font: 600 3.8rem/0.9 var(--sa-serif); letter-spacing: -0.02em; }
    .caja-hoy strong sup { font-size: 0.45em; vertical-align: 0.9em; margin-right: 2px; color: var(--sa-tinta-2); }
    .caja-datos { display: flex; gap: 30px; padding-bottom: 6px; flex-wrap: wrap; }
    .caja-datos small { display: block; color: var(--sa-tinta-3); font-size: 0.78rem; }
    .caja-datos b { font-size: 1.15rem; font-weight: 600; }
    .sierra { position: relative; margin-top: 22px; }
    .sierra svg { width: 100%; height: auto; display: block; overflow: visible; }
    .sierra .cresta { fill: var(--sa-noche); }
    .sierra .cresta.entrada { animation: subir 1.1s cubic-bezier(.2, .7, .2, 1) both; }
    .sierra .antes { fill: none; stroke: #a89880; stroke-width: 1.6; stroke-dasharray: 4 4; stroke-linejoin: round; }
    .sierra .marca-hoy { stroke: var(--sa-ambar); stroke-width: 1.5; }
    .sierra .punto-hoy { fill: var(--sa-ambar); stroke: var(--sa-papel); stroke-width: 2; }
    .sierra-eje { display: flex; justify-content: space-between; margin-top: 8px; color: var(--sa-tinta-3); font-size: 0.74rem; }
    .leyenda { display: flex; gap: 18px; margin-top: 14px; font-size: 0.76rem; color: var(--sa-tinta-2); flex-wrap: wrap; }
    .leyenda span { display: inline-flex; align-items: center; gap: 7px; }
    .leyenda i { width: 14px; height: 8px; border-radius: 2px; background: var(--sa-noche); }
    .leyenda i.antes { height: 0; border-top: 2px dashed #a89880; background: none; border-radius: 0; }
    .burbuja {
      position: absolute; pointer-events: none; transform: translate(-50%, -110%); z-index: 2;
      background: var(--sa-noche); color: #fff; font-size: 0.76rem; padding: 6px 10px; border-radius: 8px;
      white-space: nowrap; opacity: 0; transition: opacity 0.12s;
    }
    .burbuja.visible { opacity: 1; }
    .burbuja b { display: block; font-size: 0.9rem; }
    @keyframes subir { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

    /* Para hacer hoy */
    .tarea { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-top: 1px solid var(--sa-linea-2); }
    .tarea:first-child { border-top: 0; padding-top: 4px; }
    .tarea .icono { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--sa-ambar-fondo); color: var(--sa-ambar-oscuro); flex-shrink: 0; }
    .tarea .icono.agua { background: var(--sa-agua-fondo); color: var(--sa-agua); }
    .tarea .icono.rojo { background: var(--sa-rojo-fondo); color: var(--sa-rojo); }
    .tarea .icono.estrella { background: #f3ecd8; color: #8a6b12; }
    .tarea div { flex: 1; min-width: 0; }
    .tarea b { display: block; font-weight: 600; }
    .tarea p { color: var(--sa-tinta-2); font-size: 0.82rem; margin-top: 2px; }
    .tarea .sa-boton-sec { align-self: center; padding: 7px 12px; font-size: 0.8rem; white-space: nowrap; }

    /* Más vendidos */
    .ranking li { list-style: none; display: grid; grid-template-columns: 22px 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--sa-linea-2); }
    .ranking li:first-child { border-top: 0; padding-top: 0; }
    .ranking li.sa-vacio { display: block; }
    .ranking .pos { font: 600 1.35rem/1 var(--sa-serif); color: var(--sa-tinta-3); text-align: center; }
    .ranking img, .sin-foto { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: var(--sa-papel-2); display: block; }
    .ranking b { font-weight: 600; display: block; }
    .ranking .barra { height: 4px; border-radius: 4px; background: var(--sa-linea-2); margin-top: 7px; overflow: hidden; }
    .ranking .barra i { display: block; height: 100%; background: var(--sa-noche); border-radius: 4px; }
    .ranking .monto { text-align: right; }
    .ranking .monto small { display: block; color: var(--sa-tinta-3); font-size: 0.76rem; }

    /* Stock por reponer */
    .stock-lista li { list-style: none; display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--sa-linea-2); }
    .stock-lista li:first-child { border-top: 0; padding-top: 0; }
    .stock-lista li.sa-vacio { display: block; }
    .stock-lista img, .stock-lista .sin-foto { width: 36px; height: 36px; border-radius: 9px; }
    .stock-lista .nombre { flex: 1; min-width: 0; }
    .stock-lista .nombre small { display: block; color: var(--sa-tinta-3); font-size: 0.78rem; }
    .stock-lista .cant { font-weight: 600; font-size: 0.8rem; padding: 3px 9px; border-radius: 999px; background: var(--sa-rojo-fondo); color: var(--sa-rojo); white-space: nowrap; }
    .stock-lista .cant.poco { background: var(--sa-ambar-fondo); color: var(--sa-ambar-oscuro); }
    .lista-larga { max-height: 360px; overflow-y: auto; }

    /* Códigos de descuento */
    .codigos li { list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--sa-linea-2); }
    .codigos li:first-child { border-top: 0; padding-top: 0; }
    .codigos li.sa-vacio { display: block; }
    .codigos .codigo { font-weight: 700; letter-spacing: 0.04em; padding: 5px 10px; border: 1px dashed var(--sa-tinta-3); border-radius: 8px; background: var(--sa-papel-2); }
    .codigos .detalle { flex: 1; min-width: 0; color: var(--sa-tinta-2); font-size: 0.8rem; }
    .codigos .detalle b { display: block; color: var(--sa-tinta); font-weight: 600; font-size: 0.88rem; }

    /* Reseñas */
    .resena { background: var(--sa-papel-2); border: 1px solid var(--sa-linea-2); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .estrellas { color: var(--sa-ambar); letter-spacing: 2px; }
    .resena p { margin: 8px 0 10px; line-height: 1.55; }
    .resena small { color: var(--sa-tinta-3); }
    .resena .sa-acciones { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .resumen-resenas { display: flex; gap: 26px; margin: 4px 0 14px; }
    .resumen-resenas b { font: 600 1.8rem/1 var(--sa-serif); display: block; }
    .resumen-resenas small { color: var(--sa-tinta-3); font-size: 0.78rem; }
    .publicadas li { list-style: none; display: flex; gap: 10px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--sa-linea-2); }
    .publicadas li.sa-vacio { display: block; }
    .publicadas li div { flex: 1; min-width: 0; }
    .publicadas li b { font-weight: 600; }
    .publicadas li p { color: var(--sa-tinta-2); font-size: 0.84rem; margin-top: 3px; }

    @media (max-width: 900px) {
      .sa-grilla .tareas-panel { order: -1; }
      .caja-hoy strong { font-size: 3.2rem; }
      .caja-datos { gap: 20px; }
      .en-vivo { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sierra .cresta.entrada { animation: none; }
    }
  </style>
</head>
<body>

<main class="sa-pagina">
  <header class="sa-encabezado">
    <div>
      <h1>Hola, Sendera</h1>
      <p id="fecha-hoy"></p>
    </div>
    <span class="en-vivo"><i></i>Actualizado en vivo</span>
  </header>

  <div class="sa-grilla">
    <section class="sa-panel">
      <div class="sa-panel-titulo"><h2>Caja</h2></div>
      <div class="caja-cifras">
        <div class="caja-hoy">
          <small>Vendido hoy</small>
          <strong class="sa-num"><sup>$</sup><span id="caja-hoy">0</span></strong>
        </div>
        <div class="caja-datos">
          <div><small>Este mes</small><b class="sa-num" id="caja-mes">$0</b></div>
          <div><small>Pedidos hoy</small><b class="sa-num" id="pedidos-hoy">0</b></div>
          <div><small>Ticket promedio del mes</small><b class="sa-num" id="ticket">—</b></div>
        </div>
      </div>
      <div class="sierra">
        <svg id="sierra-svg" viewBox="0 0 720 190" role="img" aria-label="Ventas por día de las últimas dos semanas, comparadas con las dos anteriores"></svg>
        <div class="burbuja" id="burbuja"></div>
        <div class="sierra-eje" id="sierra-eje"></div>
        <div class="leyenda"><span><i></i>Últimos 14 días</span><span><i class="antes"></i>Los 14 días anteriores</span></div>
      </div>
    </section>

    <section class="sa-panel tareas-panel">
      <div class="sa-panel-titulo"><h2>Para hacer hoy</h2></div>
      <div id="tareas"></div>
    </section>
  </div>

  <div class="sa-grilla">
    <section class="sa-panel">
      <div class="sa-panel-titulo"><h2>Más vendidos este mes</h2><a class="sa-enlace" href="productos.html">Productos <i data-lucide="chevron-right"></i></a></div>
      <ol class="ranking" id="ranking"></ol>
    </section>
    <section class="sa-panel">
      <div class="sa-panel-titulo"><h2>Stock por reponer</h2><a class="sa-enlace" href="stock.html">Stock <i data-lucide="chevron-right"></i></a></div>
      <ul class="stock-lista lista-larga" id="stock-lista"></ul>
    </section>
  </div>

  <div class="sa-grilla">
    <section class="sa-panel">
      <div class="sa-panel-titulo"><h2>Códigos de descuento</h2><button type="button" class="sa-boton-sec" id="btn-codigo"><i data-lucide="plus"></i>Crear código</button></div>
      <form class="sa-formulario" id="form-codigo" hidden>
        <input class="sa-campo" id="cd-codigo" placeholder="Código, por ejemplo SENDERA10" autocomplete="off" maxlength="40" />
        <div class="sa-fila-campos">
          <select class="sa-campo" id="cd-tipo"><option value="porcentaje">Porcentaje</option><option value="fijo">Monto fijo en pesos</option></select>
          <input class="sa-campo" id="cd-descuento" type="number" min="1" placeholder="Valor, por ejemplo 10" />
        </div>
        <div class="sa-acciones"><button type="button" class="sa-boton-sec" data-cerrar="form-codigo">Cancelar</button><button type="submit" class="sa-boton">Crear código</button></div>
      </form>
      <ul class="codigos" id="codigos"></ul>
    </section>

    <section class="sa-panel" id="resenas-panel">
      <div class="sa-panel-titulo"><h2>Reseñas</h2><button type="button" class="sa-boton-sec" id="btn-resena"><i data-lucide="plus"></i>Agregar</button></div>
      <form class="sa-formulario" id="form-resena" hidden>
        <select class="sa-campo" id="r-estrellas">
          <option value="">Puntuación</option>
          <option value="5">5 estrellas</option>
          <option value="4">4 estrellas</option>
          <option value="3">3 estrellas</option>
          <option value="2">2 estrellas</option>
          <option value="1">1 estrella</option>
        </select>
        <div class="sa-fila-campos">
          <input class="sa-campo" id="r-nombre" placeholder="Nombre" maxlength="40" />
          <input class="sa-campo" id="r-ciudad" placeholder="Ciudad (opcional)" maxlength="40" />
        </div>
        <textarea class="sa-campo" id="r-texto" placeholder="Lo que dijo el cliente" maxlength="300"></textarea>
        <div class="sa-acciones"><button type="button" class="sa-boton-sec" data-cerrar="form-resena">Cancelar</button><button type="submit" class="sa-boton">Publicar reseña</button></div>
      </form>
      <div id="resenas-pendientes"></div>
      <div class="resumen-resenas" id="resumen-resenas"></div>
      <ul class="publicadas lista-larga" id="resenas-publicadas"></ul>
    </section>
  </div>
</main>

<script>
  const estado = { pedidos: [], productos: [], stock: {}, resenasPendientes: [], resenas: [], codigos: {} };
  const $ = id => document.getElementById(id);
  const pesos = n => '$' + num(n).toLocaleString('es-UY');
  const plural = (n, uno, varios) => n === 1 ? uno : varios.replace('#', n);
  const nombreCorto = n => esc(String(n || 'Cliente').trim().split(/\s+/)[0]);
  const enumerar = (items, max = 2) => items.length <= max ? items.join(' y ') : items.slice(0, max).join(', ') + ` y ${items.length - max} más`;
  const estrellas = n => Math.min(5, Math.max(1, parseInt(n, 10) || 5));
  const delMes = (f, ahora) => f.getMonth() === ahora.getMonth() && f.getFullYear() === ahora.getFullYear();

  const miniatura = f => f ? `<img src="${esc(f)}" alt="" loading="lazy" />` : '<span class="sin-foto"></span>';

  const fecha = new Date().toLocaleDateString('es-UY', { weekday: 'long', day: 'numeric', month: 'long' }).replace(',', '');
  $('fecha-hoy').textContent = fecha.charAt(0).toUpperCase() + fecha.slice(1);

  // ── Caja ───────────────────────────────────────
  function dibujarCaja() {
    const ahora = new Date();
    let hoy = 0, mes = 0, pedidosHoy = 0, pedidosMes = 0;
    estado.pedidos.forEach(p => {
      const f = new Date(p.fecha);
      if (isNaN(f)) return;
      if (f.toDateString() === ahora.toDateString()) { hoy += num(p.total); pedidosHoy++; }
      if (delMes(f, ahora)) { mes += num(p.total); pedidosMes++; }
    });
    $('caja-hoy').textContent = hoy.toLocaleString('es-UY');
    $('caja-mes').textContent = pesos(mes);
    $('pedidos-hoy').textContent = pedidosHoy;
    $('ticket').textContent = pedidosMes ? pesos(Math.round(mes / pedidosMes)) : '—';
    dibujarSierra();
  }

  // Ventas por día, de la más vieja a la de hoy; "desde" son los días que se saltean hacia atrás
  function ventasPorDia(desde, dias) {
    const totales = new Array(dias).fill(0);
    const base = new Date();
    base.setHours(0, 0, 0, 0);
    estado.pedidos.forEach(p => {
      const f = new Date(p.fecha);
      if (isNaN(f)) return;
      f.setHours(0, 0, 0, 0);
      const atras = Math.round((base - f) / 86400000) - desde;
      if (atras >= 0 && atras < dias) totales[dias - 1 - atras] += num(p.total);
    });
    return totales;
  }

  let sierraDibujada = false;
  function dibujarSierra() {
    const ultimos = ventasPorDia(0, 14);
    const anteriores = ventasPorDia(14, 14);
    const W = 720, H = 190, base = 182, techo = 26, margen = 10;
    const max = Math.max(1, ...ultimos, ...anteriores);
    const x = i => margen + (i / 13) * (W - margen * 2);
    const y = v => base - (v / max) * (base - techo);
    const linea = d => d.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const svg = $('sierra-svg');
    svg.innerHTML = `
      <path class="cresta${sierraDibujada ? '' : ' entrada'}" d="M${margen},${base} ${linea(ultimos).replace(/^M/, 'L')} L${W - margen},${base} Z"/>
      <path class="antes" d="${linea(anteriores)}"/>
      <line class="marca-hoy" x1="${x(13)}" y1="${y(ultimos[13]) - 4}" x2="${x(13)}" y2="${y(ultimos[13]) - 22}"/>
      <circle class="punto-hoy" cx="${x(13)}" cy="${y(ultimos[13])}" r="5.5"/>
      ${ultimos.map((_, i) => `<rect data-i="${i}" x="${x(i) - W / 28}" y="0" width="${W / 14}" height="${H}" fill="transparent"/>`).join('')}`;
    sierraDibujada = true;
    const dia = i => { const d = new Date(); d.setDate(d.getDate() - (13 - i)); return d; };
    const corto = d => d.toLocaleDateString('es-UY', { day: 'numeric', month: 'short' }).replace('.', '');
    $('sierra-eje').innerHTML = `<span>${corto(dia(0))}</span><span>${corto(dia(7))}</span><span>Hoy</span>`;
    const burbuja = $('burbuja');
    svg.querySelectorAll('rect').forEach(r => {
      r.addEventListener('mouseenter', () => {
        const i = +r.dataset.i;
        const caja = svg.getBoundingClientRect();
        burbuja.innerHTML = `${i === 13 ? 'Hoy' : corto(dia(i))}<b>${pesos(ultimos[i])}</b>`;
        burbuja.style.left = (x(i) / W) * caja.width + 'px';
        burbuja.style.top = (y(ultimos[i]) / H) * caja.height + 'px';
        burbuja.classList.add('visible');
      });
      r.addEventListener('mouseleave', () => burbuja.classList.remove('visible'));
    });
  }

  // ── Stock ──────────────────────────────────────
  function variantesConStock() {
    const lista = [];
    estado.productos.forEach(p => (p.variantes || []).forEach((v, i) => {
      if (!v) return;
      const id = v.stockId || p.id + '-' + i;
      lista.push({ producto: p.nombre || '', variante: v.nombre || '', foto: fotoVariante(v), cant: num(estado.stock[id]) });
    }));
    return lista;
  }

  function dibujarStock() {
    const bajos = variantesConStock().filter(v => v.cant <= 3).sort((a, b) => a.cant - b.cant);
    $('stock-lista').innerHTML = bajos.length
      ? bajos.map(v => `
        <li>${miniatura(v.foto)}
          <span class="nombre">${esc(v.producto)}<small>${esc(v.variante)}</small></span>
          <span class="cant ${v.cant > 0 ? 'poco' : ''}">${v.cant > 0 ? 'Quedan ' + v.cant : 'Sin stock'}</span>
        </li>`).join('')
      : '<li class="sa-vacio"><i data-lucide="circle-check"></i>Todo el stock en orden.</li>';
    panel.iconos();
  }

  // ── Para hacer hoy ─────────────────────────────
  function dibujarTareas() {
    const de = e => estado.pedidos.filter(p => p.estado === e);
    const transf = de('pendiente-transferencia');
    const efectivo = de('pendiente-efectivo');
    const sinPago = de('pendiente');
    const revisar = de('revisar-monto');
    const sinStock = variantesConStock().filter(v => v.cant <= 0);
    const resenas = estado.resenasPendientes;
    const tareas = [];
    if (revisar.length) tareas.push({ icono: 'circle-alert', clase: 'rojo', titulo: plural(revisar.length, 'Revisar 1 pago incompleto', 'Revisar # pagos incompletos'),
      texto: `Mercado Pago cobró menos que el total en ${revisar.length === 1 ? 'el pedido' : 'los pedidos'} de ${enumerar(revisar.map(p => nombreCorto(p.cliente)))}.`, boton: 'Revisar', href: 'pedidos.html#revisar-monto' });
    if (transf.length) tareas.push({ icono: 'landmark', titulo: plural(transf.length, 'Confirmar 1 transferencia', 'Confirmar # transferencias'),
      texto: `De ${enumerar(transf.map(p => nombreCorto(p.cliente)))}. Revisá que el pago haya llegado.`, boton: 'Revisar', href: 'pedidos.html#pendiente-transferencia' });
    if (efectivo.length) tareas.push({ icono: 'banknote', clase: 'agua', titulo: plural(efectivo.length, 'Coordinar 1 retiro en efectivo', 'Coordinar # retiros en efectivo'),
      texto: `${enumerar(efectivo.map(p => nombreCorto(p.cliente)))} ${efectivo.length === 1 ? 'paga' : 'pagan'} al retirar en Cordón.`, boton: 'Ver', href: 'pedidos.html#pendiente-efectivo' });
    if (sinPago.length) tareas.push({ icono: 'clock', titulo: plural(sinPago.length, '1 pedido sin pago confirmado', '# pedidos sin pago confirmado'),
      texto: 'Mercado Pago todavía no confirmó el pago.', boton: 'Ver', href: 'pedidos.html#pendiente' });
    if (sinStock.length) tareas.push({ icono: 'triangle-alert', clase: 'rojo', titulo: plural(sinStock.length, 'Reponer 1 color sin stock', 'Reponer # colores sin stock'),
      texto: enumerar(sinStock.map(v => esc(`${v.producto} ${v.variante}`))) + '.', boton: 'Ver stock', href: 'stock.html#sin' });
    if (resenas.length) tareas.push({ icono: 'star', clase: 'estrella', titulo: plural(resenas.length, 'Aprobar 1 reseña', 'Aprobar # reseñas'),
      texto: resenas.length === 1
        ? `${esc(resenas[0].nombre || 'Alguien')}${resenas[0].ciudad ? ', de ' + esc(resenas[0].ciudad) + ',' : ''} dejó ${estrellas(resenas[0].estrellas)} estrellas.`
        : 'Esperan tu aprobación para aparecer en la tienda.', boton: 'Leer', href: '#resenas-panel' });
    $('tareas').innerHTML = tareas.length
      ? tareas.map(t => `
        <div class="tarea">
          <span class="icono ${t.clase || ''}"><i data-lucide="${t.icono}"></i></span>
          <div><b>${t.titulo}</b><p>${t.texto}</p></div>
          <a class="sa-boton-sec" href="${t.href}">${t.boton}</a>
        </div>`).join('')
      : '<div class="sa-vacio"><i data-lucide="circle-check"></i>Todo al día. No hay nada pendiente.</div>';
    panel.pendientes(transf.length + efectivo.length + sinPago.length + revisar.length);
    panel.iconos();
  }

  // ── Más vendidos del mes ───────────────────────
  function dibujarRanking() {
    const ahora = new Date();
    const porProducto = {};
    estado.pedidos.forEach(p => {
      const f = new Date(p.fecha);
      if (isNaN(f) || !delMes(f, ahora)) return;
      (p.productos || []).forEach(pr => {
        const nombre = String(pr.nombre || '').trim();
        if (!nombre) return;
        const r = porProducto[nombre] || (porProducto[nombre] = { nombre, unidades: 0, total: 0 });
        r.unidades += num(pr.qty);
        r.total += num(pr.qty) * num(pr.precio);
      });
    });
    const top = Object.values(porProducto).sort((a, b) => b.unidades - a.unidades || b.total - a.total).slice(0, 5);
    if (!top.length) { $('ranking').innerHTML = '<li class="sa-vacio">Todavía no hay ventas este mes.</li>'; return; }
    const max = top[0].unidades || 1;
    $('ranking').innerHTML = top.map((r, i) => {
      const prod = estado.productos.find(p => p.nombre === r.nombre);
      return `
        <li>
          <span class="pos">${i + 1}</span>
          ${miniatura(prod ? fotoVariante((prod.variantes || [])[0]) : '')}
          <div><b>${esc(r.nombre)}</b><div class="barra"><i style="width:${Math.round(r.unidades / max * 100)}%"></i></div></div>
          <div class="monto"><b class="sa-num">${pesos(r.total)}</b><small class="sa-num">${r.unidades} ${r.unidades === 1 ? 'vendido' : 'vendidos'}</small></div>
        </li>`;
    }).join('');
  }

  // ── Códigos de descuento ───────────────────────
  function dibujarCodigos() {
    const entradas = Object.entries(estado.codigos);
    $('codigos').innerHTML = entradas.length
      ? entradas.map(([codigo, d]) => `
        <li>
          <span class="codigo">${esc(codigo)}</span>
          <span class="detalle"><b>${d.tipo === 'porcentaje' ? num(d.descuento) + '% en toda la compra' : pesos(d.descuento) + ' de descuento'}</b>${d.activo ? 'Activo' : 'Pausado'}</span>
          <button type="button" class="sa-interruptor" role="switch" aria-checked="${!!d.activo}" aria-label="Activar ${esc(codigo)}" data-codigo="${esc(codigo)}"></button>
          <button type="button" class="sa-icono-btn" data-borrar-codigo="${esc(codigo)}" aria-label="Borrar ${esc(codigo)}"><i data-lucide="trash-2"></i></button>
        </li>`).join('')
      : '<li class="sa-vacio">Todavía no hay códigos. Creá uno para tus promociones.</li>';
    panel.iconos();
  }

  $('codigos').addEventListener('click', async e => {
    const interruptor = e.target.closest('[data-codigo]');
    const borrar = e.target.closest('[data-borrar-codigo]');
    if (interruptor) {
      const codigo = interruptor.dataset.codigo;
      const activo = !(estado.codigos[codigo] && estado.codigos[codigo].activo);
      await db.ref('codigos_descuento/' + codigo + '/activo').set(activo);
      panel.aviso(`${codigo} ${activo ? 'activado' : 'pausado'}`);
    }
    if (borrar) {
      const codigo = borrar.dataset.borrarCodigo;
      const ok = await panel.confirmar({ titulo: `¿Borrar el código ${codigo}?`, texto: 'Quien lo tenga ya no va a poder usarlo.', boton: 'Borrar código', peligro: true });
      if (!ok) return;
      await db.ref('codigos_descuento/' + codigo).remove();
      panel.aviso(`Código ${codigo} borrado`);
    }
  });

  $('form-codigo').addEventListener('submit', async e => {
    e.preventDefault();
    const codigo = $('cd-codigo').value.trim().toUpperCase();
    const tipo = $('cd-tipo').value;
    const descuento = parseFloat($('cd-descuento').value);
    // Mismo formato que acepta el servidor al cobrar (api/_pedido.js)
    if (!/^[A-Z0-9_-]{1,40}$/.test(codigo)) return panel.aviso('El código solo puede tener letras, números, guiones o guiones bajos, sin espacios.', true);
    if (!(descuento > 0) || (tipo === 'porcentaje' && descuento > 100)) return panel.aviso(tipo === 'porcentaje' ? 'El porcentaje tiene que ser entre 1 y 100.' : 'Poné un monto mayor a 0.', true);
    await db.ref('codigos_descuento/' + codigo).set({ tipo, descuento, activo: true });
    e.target.reset();
    e.target.hidden = true;
    panel.aviso(`Código ${codigo} creado`);
  });

  // ── Reseñas ────────────────────────────────────
  function dibujarResenas() {
    $('resenas-pendientes').innerHTML = estado.resenasPendientes.map(r => `
      <div class="resena">
        <span class="estrellas">${'★'.repeat(estrellas(r.estrellas))}</span>
        <p>“${esc(r.texto)}”</p>
        <small>${esc(r.nombre || 'Sin nombre')}${r.ciudad ? ', ' + esc(r.ciudad) : ''}. Espera tu aprobación.</small>
        <div class="sa-acciones">
          <button type="button" class="sa-boton" data-aprobar="${esc(r.id)}"><i data-lucide="check"></i>Publicar</button>
          <button type="button" class="sa-boton-sec" data-descartar="${esc(r.id)}">Descartar</button>
        </div>
      </div>`).join('');
    const publicadas = estado.resenas.slice().sort((a, b) => num(b.orden) - num(a.orden));
    const promedio = publicadas.length ? publicadas.reduce((s, r) => s + estrellas(r.estrellas), 0) / publicadas.length : 0;
    $('resumen-resenas').innerHTML = `
      <div><b class="sa-num">${publicadas.length}</b><small>publicadas</small></div>
      <div><b class="sa-num">${publicadas.length ? promedio.toLocaleString('es-UY', { maximumFractionDigits: 1 }) : '—'}</b><small>de promedio</small></div>`;
    $('resenas-publicadas').innerHTML = publicadas.length
      ? publicadas.map(r => `
        <li>
          <div><b>${esc(r.nombre || 'Sin nombre')}</b>${r.ciudad ? ', ' + esc(r.ciudad) : ''} <span class="estrellas">${'★'.repeat(estrellas(r.estrellas))}</span><p>“${esc(r.texto || '')}”</p></div>
          <button type="button" class="sa-icono-btn" data-borrar-resena="${esc(r.id)}" aria-label="Borrar reseña"><i data-lucide="trash-2"></i></button>
        </li>`).join('')
      : '<li class="sa-vacio">Todavía no hay reseñas publicadas.</li>';
    panel.iconos();
  }

  $('resenas-panel').addEventListener('click', async e => {
    const aprobar = e.target.closest('[data-aprobar]');
    const descartar = e.target.closest('[data-descartar]');
    const borrar = e.target.closest('[data-borrar-resena]');
    if (aprobar) {
      const id = aprobar.dataset.aprobar;
      const r = estado.resenasPendientes.find(x => x.id === id);
      if (!r) return;
      aprobar.disabled = true;
      await db.ref('resenas').push({ nombre: r.nombre, ciudad: r.ciudad || '', texto: r.texto, estrellas: estrellas(r.estrellas), fecha: r.fecha || new Date().toISOString(), orden: Date.now(), aprobada: true });
      await db.ref('resenas_pendientes/' + id).remove();
      panel.aviso('Reseña publicada');
    }
    if (descartar) {
      const ok = await panel.confirmar({ titulo: '¿Descartar esta reseña?', texto: 'No se publica y se borra de la lista.', boton: 'Descartar', peligro: true });
      if (!ok) return;
      await db.ref('resenas_pendientes/' + descartar.dataset.descartar).remove();
      panel.aviso('Reseña descartada');
    }
    if (borrar) {
      const ok = await panel.confirmar({ titulo: '¿Borrar esta reseña?', texto: 'Deja de aparecer en la tienda.', boton: 'Borrar reseña', peligro: true });
      if (!ok) return;
      await db.ref('resenas/' + borrar.dataset.borrarResena).remove();
      panel.aviso('Reseña borrada');
    }
  });

  $('form-resena').addEventListener('submit', async e => {
    e.preventDefault();
    const nombre = $('r-nombre').value.trim();
    const ciudad = $('r-ciudad').value.trim();
    const texto = $('r-texto').value.trim();
    const puntos = parseInt($('r-estrellas').value, 10);
    if (!nombre || !texto || !puntos) return panel.aviso('Completá la puntuación, el nombre y el texto.', true);
    await db.ref('resenas').push({ nombre, ciudad, texto, estrellas: puntos, fecha: new Date().toISOString(), orden: Date.now() });
    e.target.reset();
    e.target.hidden = true;
    panel.aviso('Reseña publicada');
  });

  // Botones para mostrar y cerrar los formularios
  $('btn-codigo').addEventListener('click', () => { $('form-codigo').hidden = false; $('cd-codigo').focus(); });
  $('btn-resena').addEventListener('click', () => { $('form-resena').hidden = false; $('r-estrellas').focus(); });
  document.querySelectorAll('[data-cerrar]').forEach(b => b.addEventListener('click', () => {
    const f = $(b.dataset.cerrar);
    f.reset();
    f.hidden = true;
  }));

  // ── Datos en vivo ──────────────────────────────
  const lista = snap => { const items = []; snap.forEach(c => { items.push({ id: c.key, ...c.val() }); }); return items; };
  db.ref('pedidos').on('value', snap => { estado.pedidos = lista(snap); dibujarCaja(); dibujarRanking(); dibujarTareas(); });
  db.ref('productos').on('value', snap => { estado.productos = lista(snap); dibujarRanking(); dibujarStock(); dibujarTareas(); });
  db.ref('stock').on('value', snap => { estado.stock = snap.val() || {}; dibujarStock(); dibujarTareas(); });
  db.ref('resenas_pendientes').on('value', snap => { estado.resenasPendientes = lista(snap); dibujarResenas(); dibujarTareas(); });
  db.ref('resenas').on('value', snap => { estado.resenas = lista(snap); dibujarResenas(); });
  db.ref('codigos_descuento').on('value', snap => { estado.codigos = snap.val() || {}; dibujarCodigos(); });
</script>
</body>
</html>
