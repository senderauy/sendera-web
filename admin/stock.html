<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" href="../img/logo.png" />
  <link rel="icon" type="image/png" href="../img/logo.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sendera Admin" />
  <meta name="theme-color" content="#182417" />
  <title>Sendera - Stock</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="../firebase-config.js"></script>
  <script src="admin-auth.js?v=2"></script>
  <link rel="stylesheet" href="admin.css?v=1" />
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="admin-ui.js?v=1"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { min-height: 100vh; font-size: 14px; line-height: 1.5; }
    button, input { font-family: inherit; }

    .categoria { font: 600 1.45rem/1.2 var(--sa-serif); color: var(--sa-tinta); margin: 30px 0 14px; }
    .categoria:first-child { margin-top: 6px; }
    .productos { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; align-items: start; }
    .producto { padding: 18px 20px 8px; }
    .producto > header { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--sa-linea-2); }
    .producto > header div { min-width: 0; }
    .producto > header b { display: block; font-weight: 600; font-size: 0.95rem; }
    .producto > header small { color: var(--sa-tinta-3); font-size: 0.78rem; }

    .variantes li { list-style: none; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--sa-linea-2); }
    .variantes li:first-child { border-top: 0; }
    .variantes .sa-mini { width: 36px; height: 36px; border-radius: 9px; }
    .variantes .nombre b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .variantes .nombre small { color: var(--sa-tinta-3); font-size: 0.78rem; font-variant-numeric: tabular-nums; }

    .contador { display: inline-flex; align-items: center; border: 1px solid var(--sa-linea); border-radius: 10px; background: var(--sa-papel); overflow: hidden; }
    .contador button { width: 34px; height: 34px; display: grid; place-items: center; border: 0; background: var(--sa-papel-2); color: var(--sa-tinta-2); cursor: pointer; }
    .contador button:hover { background: var(--sa-linea-2); color: var(--sa-tinta); }
    .contador button:disabled { color: var(--sa-linea); cursor: default; background: var(--sa-papel-2); }
    .contador button .lucide { width: 15px; height: 15px; }
    .contador input {
      width: 46px; height: 34px; border: 0; border-left: 1px solid var(--sa-linea); border-right: 1px solid var(--sa-linea);
      text-align: center; font-size: 0.95rem; font-weight: 600; color: var(--sa-tinta); background: none; outline: none;
      font-variant-numeric: tabular-nums; -moz-appearance: textfield; appearance: textfield;
    }
    .contador input::-webkit-outer-spin-button, .contador input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .contador input:focus { background: var(--sa-ambar-fondo); }

    .vacio-pagina { background: var(--sa-papel); border: 1px solid var(--sa-linea); border-radius: 16px; }
    .vacio-pagina .sa-boton-sec { margin-top: 12px; }

    @media (max-width: 900px) {
      .productos { grid-template-columns: minmax(0, 1fr); }
      .producto { padding: 16px 16px 6px; }
      .variantes li { grid-template-columns: 36px minmax(0, 1fr) auto; grid-template-areas: "foto nombre contador" "foto estado contador"; row-gap: 4px; }
      .variantes .sa-mini { grid-area: foto; align-self: start; }
      .variantes .nombre { grid-area: nombre; }
      .variantes .sa-pastilla { grid-area: estado; justify-self: start; }
      .variantes .contador { grid-area: contador; }
    }
  </style>
</head>
<body>

<main class="sa-pagina">
  <header class="sa-encabezado">
    <div>
      <h1>Stock</h1>
      <p>Usá + y − o escribí la cantidad. Cada cambio se guarda al instante.</p>
    </div>
    <label class="sa-buscador"><i data-lucide="search"></i><input id="buscar" type="search" placeholder="Producto o color" aria-label="Buscar producto o color" autocomplete="off" /></label>
  </header>

  <div class="sa-cifras" aria-live="polite">
    <div><small>Colores a la venta</small><b id="r-total">—</b></div>
    <div><small>Unidades en total</small><b id="r-unidades">—</b></div>
    <div><small>Sin stock</small><b id="r-sinstk">—</b></div>
    <div><small>Con poco stock</small><b id="r-poco">—</b></div>
  </div>

  <div class="sa-filtros" id="filtros" aria-label="Filtrar por stock"></div>

  <div id="catalogo"><div class="sa-vacio vacio-pagina">Cargando productos…</div></div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const pesos = n => '$' + num(n).toLocaleString('es-UY');
  const POCO = 3;

  const estado = { productos: [], stock: {}, cargado: { productos: false, stock: false } };
  // Desde el Inicio se llega con el filtro en la dirección (stock.html#sin)
  let filtro = ['sin', 'poco'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'todos';

  const FILTROS = [['todos', 'Todos'], ['sin', 'Sin stock'], ['poco', 'Poco stock']];
  const nivel = n => n <= 0 ? 'sin' : n <= POCO ? 'poco' : 'ok';
  const PASTILLAS = { sin: ['rojo', 'Sin stock'], poco: ['ambar', 'Poco stock'], ok: ['verde', 'Disponible'] };
  const pastilla = n => { const [c, t] = PASTILLAS[nivel(n)]; return `<span class="sa-pastilla ${c}">${t}</span>`; };
  const cantidad = id => Math.max(0, Math.floor(num(estado.stock[id])));
  const normal = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  function miniatura(foto) {
    const f = fotoLiviana(foto);
    return f ? `<img class="sa-mini" src="${esc(f)}" alt=""${/^(blob|data):/.test(f) ? '' : ' loading="lazy"'} />` : '<span class="sa-mini"><i data-lucide="package"></i></span>';
  }

  // Cada color tiene su lugar en "stock": el mismo que usa la tienda (stockId propio o producto-posición)
  function colores() {
    const lista = [];
    estado.productos.forEach(p => {
      const variantes = Array.isArray(p.variantes) ? p.variantes : Object.values(p.variantes || {});
      variantes.forEach((v, i) => {
        if (!v || typeof v !== 'object') return;
        lista.push({ id: v.stockId || p.id + '-' + i, producto: p, nombre: v.nombre || 'Sin nombre', precio: v.precio, foto: fotoVariante(v) });
      });
    });
    return lista;
  }

  function dibujarResumen() {
    if (!estado.cargado.productos || !estado.cargado.stock) return;
    const todos = colores();
    const sin = todos.filter(c => nivel(cantidad(c.id)) === 'sin').length;
    const poco = todos.filter(c => nivel(cantidad(c.id)) === 'poco').length;
    $('r-total').textContent = todos.length;
    $('r-unidades').textContent = todos.reduce((s, c) => s + cantidad(c.id), 0).toLocaleString('es-UY');
    $('r-sinstk').textContent = sin;
    $('r-sinstk').classList.toggle('alerta', sin > 0);
    $('r-poco').textContent = poco;
    const cuantos = { todos: todos.length, sin, poco };
    $('filtros').innerHTML = FILTROS.map(([f, t]) => `<button type="button" data-filtro="${f}" aria-pressed="${f === filtro}">${t} <em>${cuantos[f]}</em></button>`).join('');
  }

  function dibujarCatalogo() {
    if (!estado.cargado.productos || !estado.cargado.stock) return;
    dibujarResumen();
    if (!estado.productos.length) {
      $('catalogo').innerHTML = '<div class="sa-vacio vacio-pagina"><i data-lucide="package"></i>Todavía no hay productos cargados.<br><a class="sa-boton-sec" href="productos.html">Ir a Productos</a></div>';
      panel.iconos();
      return;
    }
    const q = normal($('buscar').value.trim());
    const visibles = colores().filter(c =>
      (filtro === 'todos' || nivel(cantidad(c.id)) === filtro) &&
      (!q || normal(`${c.producto.nombre} ${c.nombre} ${c.producto.categoria || ''}`).includes(q)));

    // Agrupados por categoría y producto, en el mismo orden que la tienda
    const grupos = new Map();
    visibles.forEach(c => {
      const cat = c.producto.categoria || 'Otros';
      if (!grupos.has(cat)) grupos.set(cat, new Map());
      const prods = grupos.get(cat);
      if (!prods.has(c.producto.id)) prods.set(c.producto.id, { producto: c.producto, colores: [] });
      prods.get(c.producto.id).colores.push(c);
    });

    $('catalogo').innerHTML = grupos.size
      ? [...grupos].map(([cat, prods]) => `
        <h2 class="categoria">${esc(cat)}</h2>
        <div class="productos">${[...prods.values()].map(({ producto: p, colores: cs }) => `
          <article class="sa-panel producto">
            <header>${miniatura(cs[0].foto)}<div><b>${esc(p.nombre || 'Sin nombre')}</b><small>${esc(p.subgrupo || p.categoria || '')}</small></div></header>
            <ul class="variantes">${cs.map(c => `
              <li data-stock-id="${esc(c.id)}">
                ${miniatura(c.foto)}
                <span class="nombre"><b>${esc(c.nombre)}</b><small>${pesos(c.precio)}</small></span>
                ${pastilla(cantidad(c.id))}
                <span class="contador">
                  <button type="button" data-sumar="-1" aria-label="Restar uno a ${esc(p.nombre)} ${esc(c.nombre)}"${cantidad(c.id) <= 0 ? ' disabled' : ''}><i data-lucide="minus"></i></button>
                  <input type="number" inputmode="numeric" min="0" step="1" value="${cantidad(c.id)}" aria-label="Unidades de ${esc(p.nombre)} ${esc(c.nombre)}" />
                  <button type="button" data-sumar="1" aria-label="Sumar uno a ${esc(p.nombre)} ${esc(c.nombre)}"><i data-lucide="plus"></i></button>
                </span>
              </li>`).join('')}
            </ul>
          </article>`).join('')}
        </div>`).join('')
      : `<div class="sa-vacio vacio-pagina">${q ? 'Ningún producto o color coincide con la búsqueda.' : filtro === 'sin' ? '<i data-lucide="circle-check"></i>No hay colores sin stock.' : '<i data-lucide="circle-check"></i>No hay colores con poco stock.'}</div>`;
    panel.iconos();
  }

  // Cuando cambia el stock se actualizan los números en su lugar, sin redibujar (así no se pierde lo que se está escribiendo)
  function pintarStock() {
    document.querySelectorAll('[data-stock-id]').forEach(li => {
      const n = cantidad(li.dataset.stockId);
      const input = li.querySelector('input');
      if (document.activeElement !== input) input.value = n;
      li.querySelector('.sa-pastilla').outerHTML = pastilla(n);
      li.querySelector('[data-sumar="-1"]').disabled = n <= 0;
    });
    dibujarResumen();
  }

  async function guardar(id, valor) {
    const nuevo = Math.max(0, Math.floor(num(valor)));
    estado.stock[id] = nuevo;
    pintarStock();
    try {
      await db.ref('stock/' + id).set(nuevo);
      panel.aviso('Stock guardado');
    } catch (e) {
      panel.aviso('No se pudo guardar el stock. Revisá la conexión y probá de nuevo.', true);
    }
  }

  // ── Eventos ────────────────────────────────────
  $('catalogo').addEventListener('click', e => {
    const b = e.target.closest('[data-sumar]');
    if (!b) return;
    const id = b.closest('[data-stock-id]').dataset.stockId;
    guardar(id, cantidad(id) + Number(b.dataset.sumar));
  });
  $('catalogo').addEventListener('change', e => {
    if (!e.target.matches('input[type="number"]')) return;
    const id = e.target.closest('[data-stock-id]').dataset.stockId;
    if (e.target.value === '' || Math.floor(num(e.target.value)) === cantidad(id)) { e.target.value = cantidad(id); return; }
    guardar(id, e.target.value);
  });
  $('catalogo').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches('input[type="number"]')) e.target.blur();
  });
  $('catalogo').addEventListener('focusin', e => { if (e.target.matches('input[type="number"]')) e.target.select(); });
  $('filtros').addEventListener('click', e => {
    const b = e.target.closest('[data-filtro]');
    if (!b) return;
    filtro = b.dataset.filtro;
    dibujarCatalogo();
  });
  $('buscar').addEventListener('input', dibujarCatalogo);

  // ── Datos en vivo ──────────────────────────────
  db.ref('productos').on('value', snap => {
    const lista = [];
    snap.forEach(c => { const v = c.val(); if (v && typeof v === 'object') lista.push({ ...v, id: c.key }); });
    lista.sort((a, b) => (num(a.orden) || 999) - (num(b.orden) || 999) || String(a.nombre || '').localeCompare(String(b.nombre || '')));
    estado.productos = lista;
    estado.cargado.productos = true;
    dibujarCatalogo();
  });
  db.ref('stock').on('value', snap => {
    estado.stock = snap.val() || {};
    const primeraVez = !estado.cargado.stock;
    estado.cargado.stock = true;
    if (primeraVez) dibujarCatalogo();
    else pintarStock();
  });
</script>
</body>
</html>
